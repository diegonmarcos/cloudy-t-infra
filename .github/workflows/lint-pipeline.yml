name: lint-pipeline

# Build-pipeline hygiene — runs on every PR + push to main + manual dispatch.
# Was previously the `preflight-symlinks` job inside ship-ghcr-images.yml.
# Extracted when ship-ghcr-images.yml was retired (step_docker covers builds).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # a_solutions is its OWN repository (diegonmarcos/cloudy-u-containers),
      # NOT a submodule of this one (split out 2026-09-06). It is checked out
      # at the path every in-repo reference already uses, so nothing
      # downstream changes. fetch-depth: 0 — per-service change detection
      # walks its history. Both repos are public, so GITHUB_TOKEN suffices.
      - name: Checkout cloud-u-containers into a_solutions
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloudy-u-containers
          path: a_solutions
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Allowlist: `submodules: true` aborts checkout on the first submodule
      # CI cannot reach (vault / notes / cloud-data-lfs are private siblings;
      # cloud-master's own .gitmodules is SSH-only). Init just what is used.
      - uses: ./.github/actions/init-submodules
        with:
          include: I_cloud
          cloud_data_deploy_key: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}

      - name: Fail on broken symlinks in build contexts
        run: |
          set -e
          # Skip dist/ and build outputs — they can legitimately hold
          # machine-local symlinks that don't affect the docker build context.
          broken=$(find a_solutions -xtype l \
            -not -path "*/.git/*" \
            -not -path "*/dist/*" \
            -not -path "*/target/*" \
            -not -path "*/node_modules/*" \
            -not -path "*/z_archive/*" 2>/dev/null || true)
          if [ -n "$broken" ]; then
            echo "::error::Broken symlinks found in a_solutions/ source:"
            echo "$broken"
            exit 1
          fi
          echo "No broken symlinks in a_solutions/ source tree."
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Phase 0 — dispatch + nix-step hygiene
        run: bash 9_others/test/test_dispatch_hygiene.sh
      - name: Phase 1 — arch → runner routing
        run: bash 9_others/test/test_arch_runner_routing.sh
      - name: Phase 2 — step_docker guards (inline skip + rust binary)
        run: bash 9_others/test/test_step_docker_guards.sh
      - name: Phase 3D — mattermost base image is multi-arch
        run: bash 9_others/test/test_mattermost_multiarch.sh
      - name: Phase 3F — mail rules stay one source of truth across engines
        run: bash 9_others/test/test_mail_rules_engines_in_sync.sh
      - name: Phase 3G — mail filter views partition their axis
        run: bash 9_others/test/test_mail_filter_views_partition.sh
      - name: HM ship — opt-in VMs (oci-mail) ship only on request or own-config change
        run: bash 9_others/test/test_hm_ship_vm_optin.sh
      - name: Phase 3E — npm ci services ship a lockfile
        run: bash 9_others/test/test_npm_lockfile_present.sh
      - name: Phase 4 — build-{container}.json symlinks all resolve
        run: bash 9_others/test/test_build_container_json_pattern.sh
      - name: Phase 4B — dist-consumer detection ships what changed and only what changed
        run: bash 9_others/test/test_detect_dist_consumers.sh
      - name: Phase 5 — cloud-builder SSH mount safety
        run: bash 9_others/test/test_cloud_builder_ssh_safety.sh
      - name: Phase 6 — ship.yml passes WG_PRIVATE_KEY
        run: bash 9_others/test/test_ship_wireguard_secret.sh
      - name: Phase 8 — GHCR packages public (report-only)
        # Private packages block ship ("write_package denied") but the
        # flip is a GitHub-UI action, not a repo change. Report only.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash 9_others/test/test_ghcr_visibility.sh
      - name: Phase 9 — proxy-mcp retry is bounded (no OOM leak)
        run: bash 9_others/test/test_retry_bounded_backoff.sh
      - name: Phase 10 — no live refs to z_archive/ services
        # 2026-05-05: flipped from continue-on-error to hard-fail. The test's
        # filter chain now correctly excludes false positives (compound
        # names, shell-command fields, retirement-cleanup hooks, successor
        # services) so a hit is a real drift bug.
        run: bash 9_others/test/test_no_retired_service_refs.sh
      - name: Phase 13 — every flake.nix has a committed flake.lock
        run: bash 9_others/test/test_flake_lock_present.sh
      # Owner decision 31: MCP clients go mesh-first, else public + bearer.
      # No .mcp.json entry may be a bare http url (that falls back to OAuth/DCR).
      - name: Phase 14b — every MCP entry is mesh-first launcher or bearer http (no OAuth-only)
        run: bash 9_others/test/test_mcp_json_no_oauth_only.sh
      - name: Phase 14 — proxied_mcps children resolve to real services
        run: bash 9_others/test/test_proxied_mcps_resolution.sh
      - name: Phase 15 — engine layout detection works pre-build
        run: bash 9_others/test/test_layout_detection_pre_build.sh
      - name: Phase 15b — a lance manifest never names an absent fragment
        run: bash 9_others/test/cgc-db-lance-integrity.test.sh
      # #360: a file whose own NAME says it is private (services_private.json —
      # every internal host:port pair) was returned by a plain octocode search on
      # the PUBLIC surface, which answers anonymously off-mesh. The guard is a
      # naming convention in noindex_patterns, so the NEXT such file is excluded
      # the day it is written. Replays the patterns through git's own gitignore
      # engine — asserting the string is in the JSON would pass on a glob that
      # matches nothing.
      - name: Phase 15c — a *_private.json data file never reaches the index
        run: bash 9_others/test/cgc-db-noindex-private.test.sh
      - name: Phase 16 — every published image also has -binaries tag (report-only)
        # 2026-05-05: scope-fixed to skip compose-build services (those use
        # dockerfile_inline so the image is built on the VM, never shipped to
        # GHCR — out of scope). Remaining ~9 hits are services awaiting
        # next-ship to push the new -binaries tag (self-heal).
        # Will flip to hard fail once those services next ship.
        continue-on-error: true
        run: bash 9_others/test/test_binaries_image_published.sh
      - name: Phase 17 — runners[].builder_image is published on GHCR
        run: bash 9_others/test/test_runners_image_published.sh
      - name: Phase 18 — type=app native_build app_dir resolves to manifest
        run: bash 9_others/test/test_native_build_app_dir.sh
      - name: Phase 19 — compose-up never rebuilds on the VM (--no-build)
        run: bash 9_others/test/test_compose_no_build_on_vm.sh
      # NOT report-only, unlike Phase 11 below. Phase 11 tolerates pre-existing
      # drift because it compares against compose files that lag; this one only
      # asserts that the engine refuses a malformed containers{} and that no
      # build.json carries one. Both are true as of the fix, so any future red
      # here is a new regression — and the failure mode it guards (ship acting
      # on a PARTIAL container list, green) is silent in production.
      - name: Phase 52 — ship never acts on a truncated container list
        run: bash 9_others/test/test_container_list_not_truncated.sh
      # Guards the dispatch side of the same fail-green family: a probe that
      # triggers a workflow which does not exist, with `|| true` after it, is
      # indistinguishable from a healthy fleet.
      - name: Phase 53 — fleet health probe dispatches only real workflows
        run: bash 9_others/test/test_health_all_vms_dispatch.sh
      - name: Phase 11 — container_name matches build.json (report-only)
        # Pending unix submodule sync + pre-existing drift cases;
        # cleanup happens per service.
        continue-on-error: true
        run: bash 9_others/test/test_container_name_matches_declaration.sh
      - name: Phase 12 — health-report engine B5+B7 semantics (report-only)
        # Checks cloud-data submodule copy; hard-passes only after auto-sync
        # propagates the cloud-data commit.
        continue-on-error: true
        run: bash 9_others/test/test_health_report_semantics.sh
      - name: Phase 20 — fetch-vault wired into every cloud-builder workflow
        run: bash 9_others/test/test_workflows_fetch_vault.sh
      - name: Phase 21 — no workflow uses docker/build-push-action (single-engine rule)
        run: bash 9_others/test/test_no_duplicate_image_builders.sh
      - name: Phase 22 — step_docker uses --cache-from layer cache (both branches)
        run: bash 9_others/test/test_step_docker_uses_cache.sh
      - name: Phase 23 — step_secrets writes to compose/.secrets for v2 layout
        run: bash 9_others/test/test_secrets_v2_layout_path.sh
      - name: Phase 24 — engine sources step files defensively (no engine-drift abort)
        run: bash 9_others/test/test_engine_step_sourcing_tolerant.sh
      - name: Phase 25 — every referenced cloud-ship-*-step-*.sh is git-tracked
        run: bash 9_others/test/test_engine_steps_tracked.sh
      - name: Phase 26 — step_docker installs ERR trap (no silent set -e exits)
        run: bash 9_others/test/test_step_docker_err_trap.sh
      - name: Phase 27 — step_docker GHCR login tolerates failure (no abort on RO config.json)
        run: bash 9_others/test/test_step_docker_login_tolerant.sh
      - name: Phase 28 — step_docker SSH branch ships GHCR token via stdin + uses pipefail
        run: bash 9_others/test/test_step_docker_ssh_token_passthrough.sh
      - name: Phase 30 — every workflow's 9_others/build.sh verb is valid
        run: bash 9_others/test/test_workflow_regen_verb_valid.sh
      - name: Phase 29 — SSH-builder docker run pins cwd to /workspace (entrypoint-cd guard)
        run: bash 9_others/test/test_ssh_builder_pins_workspace.sh
      - name: Phase 31 — no retired per-domain cloud-data-*.json refs in a_solutions/*/src/
        run: bash 9_others/test/test_no_stale_cloud_data_symlinks.sh
      - name: Phase 32 — every lint-pipeline tester ref is tracked + executable
        run: bash 9_others/test/test_lint_pipeline_referenced_files_tracked.sh
      - name: Phase 34 — no hardcoded cloud-builder-x image literals in wrappers
        # Wrapper-layer drift guard. Engine scripts read image from
        # II_Unix/cb_containers-builders/build.json (data-driven); wrappers
        # MUST resolve from the same source — never re-paste the literal.
        # See test header for the 2026-05-05 root-cause story.
        run: bash 9_others/test/test_no_hardcoded_builder_image_literals.sh
      - name: Phase 35 — no legacy cloud-data-gha-config.json silent fallback
        # ship-ci-image.yml + ship.yml used to silently fall through to a
        # retired config file — masked stale-image divergence (audit P1 #3).
        run: bash 9_others/test/test_no_silent_fallback_in_ship_ci_image.sh
      - name: Phase 36 — engine scripts derive workspace paths
        # cloud-ship-*.sh must use ${WORKSPACE:-/root/git}/... not bare
        # /root/git/... — paths that break in non-default mount setups.
        run: bash 9_others/test/test_engine_workspace_paths_derived.sh
      - name: Phase 37 — build-workflows.json schema invariants
        # Top-level _comment + _source + runners; per-runner type/host contract.
        # Image identity NOT in this file — lives in unix master.
        # Migrated 2026-05-09: source is 9_others/build.json; dist file is build-workflows.json.
        run: bash 9_others/test/test_runners_json_schema.sh
      - name: Phase 38 — no dead `nix profile install` branch in engine
        # Host-state mutation forbidden in engine scripts. nix_install must use
        # `nix shell` / `nix build` only (audit follow-up 2026-05-05).
        run: bash 9_others/test/test_no_dead_nix_install_branch.sh
      - name: Phase 39 — legacy unix workflows/src/static/ removed
        # Stale source tree (hardcoded literals); active source is
        # II_Unix/1_cicd/src/cicd/. Skipped if II_Unix not checked out.
        run: bash 9_others/test/test_no_legacy_unix_static_workflows.sh
      - name: Phase 40 — cloud-data-*.json consumers probe dist/z_archive/
        # Derive script archives deprecated cloud-data-*.json slices to
        # dist/z_archive/. Every consumer's probe chain MUST include a
        # dist/z_archive/<file> candidate or it silently 404s.
        run: bash 9_others/test/test_cloud_data_zarchive_probe.sh
      # Phases 41-43: three testers that lived in gha/scripts/ instead of test/
      # and were never wired into any workflow. They were consolidated into
      # test/ by the 1_cloud-configs split; wiring them in is what stops them
      # rotting again — one of them had been failing on an ambient GITHUB_TOKEN
      # for as long as it existed, which nothing would have caught.
      - name: Phase 41 — _ensure_image_public fatal-path + pull gate ordering
        run: bash 9_others/test/test_ensure_image_public_and_pull_gate.sh
      - name: Phase 42 — step_docker emits multi-arch tags
        run: bash 9_others/test/test_step_docker_multiarch_tags.sh
      - name: Phase 43 — step_secrets writes container-readable .secrets
        run: bash 9_others/test/test_step_secrets_container_readable.sh
      - name: Phase 33 — dist/ + .github/workflows/ in sync with src/ (no agent drift)
        # report-only: false-positives in CI when local + origin match but
        # CI's freshly-built dist differs (likely env-dependent — node/npm
        # version, jq version, locale, etc.). Keeps the signal visible
        # without blocking lint. Investigate + flip to fail-mode once the
        # env-dependence is removed.
        continue-on-error: true
        run: bash 9_others/test/test_dist_in_sync_with_src.sh
      # Phases 44-45: the claude/AI-config SoT gates. They live in
      # cloud-u-linux (da_my-ai/data/claude/ is the SoT) and were written with
      # no CI to run them, which is the same failure they exist to catch — a
      # rule nothing enforces. They run HERE because both gates need cloud-infra
      # AND the SoT side by side, and cloud-infra is the repo that consumes the
      # SoT: _dotfiles/apps/src/claude/ is refreshed from it by deploy-dotfiles.sh, and
      # 1_cloud-configs/dist/mcp.json is what the client lists are derived from.
      #
      - name: Phase 46 — unjam covers every ship-wg-runner workflow
        run: bash 9_others/test/test_unjam_covers_wg_group.sh
      # Phase 47 — the other half of Phase 46. Phase 46 proves the unjammer can
      # REACH every workflow holding the fleet's deploy lock; this proves the
      # lock is bounded in the first place (no job in the group may outlive the
      # ceiling) and that the unjammer actually clears a wedge rather than
      # reporting success at one. Both halves failed on 2026-09-09.
      - name: Phase 47 — ship-wg-runner lock is bounded and the unjammer escalates
        run: bash 9_others/test/test_wg_group_lock_bounded.sh
      # Phase 48 — #354. Phases 46/47 keep the deploy lock reachable and
      # bounded; neither notices that an EVICTED deploy is never re-queued, so
      # a service can be committed, built and absent from the fleet behind a
      # run list that is entirely green. This asserts the reconcile names such
      # a service from fleet state alone, and that the re-ship it triggers is
      # bounded so repairing drift cannot itself wedge the lock (#179).
      - name: Phase 48 — reconcile names deployed-behind services and re-ships them bounded
        run: bash 9_others/test/test_ship_reconcile.sh
      # Phase 49 — #357. Phase 48 proves the RECONCILE compares digests
      # correctly; this proves the `status` verb does, and it did not. It read
      # RepoDigests off the CONTAINER object, where that key does not exist,
      # and jq's `// ""` turned the impossible read into an empty string with
      # exit 0 — so the in-sync branch was unreachable and every container
      # running an image we push to GHCR came back DRIFT. Asserts a true
      # verdict in BOTH directions plus an honest UNDECIDABLE, because a
      # checker that can only ever say one word is not a checker.
      - name: Phase 49 — status gives a true digest verdict, or says it cannot
        run: bash 9_others/test/test_ship_status_digest.sh

      # Phase 50 — #149 / #359. Cross-repo dispatch used to run on a universal
      # CLASSIC PAT that also carried admin:org and delete_repo: one leaked job
      # log and the blast radius was the whole org. This asserts the dispatch
      # path names only the scoped, purpose-built secret, that the secret has
      # no `||` fallback (a fallback is a SILENT downgrade — green run, broad
      # token), and that every declared dispatcher is still wired, because a
      # dispatch that quietly stops firing is the worse failure: pushes
      # succeed, CI is green, nothing deploys. Reads the cloud-u-containers
      # checkout that this job already makes into a_solutions/.
      # Policy is data: 9_others/dispatch-policy.json.
      - name: Phase 50 — dispatch runs on a scoped credential, not a universal PAT
        run: bash 9_others/test/test_dispatch_credential_scope.sh


      # Phase 51 — #358. Two Ship runs for the SAME image can be in flight from
      # different commits; each is pinned to its own announced SHA and each
      # overwrites `:latest`, so the one that FINISHES last wins regardless of
      # which commit is newer. Agent V caught the pair live and in_progress
      # (35043145083 new vs 35043096780 old). When the older lands second,
      # `:latest` reverts to a tree without the newer fix and BOTH runs go
      # green — a successful run that silently un-ships a fix. Serialising the
      # publishers makes it rarer; only guarding the tag move makes it wrong to
      # publish backwards, which is what this asserts.
      - name: Phase 51 — :latest refuses to move backwards
        run: bash 9_others/test/test_ship_latest_monotonic.sh
      # git clone, not actions/checkout: checkout refuses a `path:` outside
      # $GITHUB_WORKSPACE, and both scripts locate each other as SIBLINGS
      # ($REPO/../cloud-t-infra) — the same layout as a dev machine's ~/git.
      # Both repos are public, so no token is involved.
      - name: Phase 44-45 — fetch the claude config SoT (cloud-u-linux)
        run: git clone --depth 1 https://github.com/diegonmarcos/cloudy-u-linux.git "$(dirname "$GITHUB_WORKSPACE")/cloud-u-linux"
      # 2026-09-06: quoted — the bare ": " inside this name made the whole file
      # invalid YAML ("mapping values are not allowed here"), so GitHub failed
      # every lint-pipeline run at startup with zero jobs from 33d5abc onward.
      - name: "Phase 44 — claude SoT: one source of truth, no second copy"
        # Asserts no flake/repo vendors its own settings or mcp template, that
        # cloud-infra's GENERATED _dotfiles/apps/src/claude/ is byte-identical to the
        # SoT, that every MCP cloud-infra declares reaches the client list, and
        # that retired MCPs stay retired.
        # Block scalar: a double-quoted YAML string cannot contain the inner
        # "$GITHUB_WORKSPACE" quotes (same startup failure as the name above).
        run: |
          "$(dirname "$GITHUB_WORKSPACE")/cloud-u-linux/da_my-ai/data/claude/test-claude-sot.sh"
      - name: Phase 45 — MCP client lists match the derived server set
        # mcp.{termux,desktop}.json.tpl are generated from THIS repo's
        # 1_cloud-configs/dist/mcp.json + the SoT's mcp-policy.json. Hand-editing
        # either tpl, or declaring a new MCP here without regenerating, fails.
        env:
          CLOUD_INFRA_DIR: ${{ github.workspace }}
        run: |
          "$(dirname "$GITHUB_WORKSPACE")/cloud-u-linux/da_my-ai/data/claude/gen-mcp-tpl.sh" --check

  # ── #453: the registered-tester suite is its own job ──────────────────
  #
  # Phase 54+55 were the last two steps of `preflight`, which is 65
  # unconditional steps — the first one that fails aborts the job and the
  # testers never run, silently. They live here as their own job with NO
  # `needs:`, so this job starts concurrently with `preflight` and cannot
  # inherit any of its failures. `preflight` going red can no longer swallow
  # the registered-tester suite.
  #
  # Real prerequisites, verified by executing the suite (not guessed):
  #   • implicit actions/checkout — the testers read the repo tree.
  #   • Checkout cloud-u-containers into a_solutions — 14 registered testers
  #     resolve a_solutions/ paths and FAIL if the checkout is absent.
  #   NOT needed (verified by execution): the I_cloud submodule and the
  #   shellcheck install — the run passes with neither present.
  registered-testers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # a_solutions is its OWN repository (diegonmarcos/cloudy-u-containers);
      # the registered testers resolve paths under it (see test headers —
      # e.g. cgc-knowledge-repo-root-resolvable refuses to pass without it).
      - name: Checkout cloud-u-containers into a_solutions
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloudy-u-containers
          path: a_solutions
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # #1064: the containers' sops files live only in the private vault; the
      # testers read <svc>/src/secrets.yaml (e.g. agent-credential-scope H).
      - name: Overlay private secrets from cloud-me-pvt-vault
        uses: ./.github/actions/overlay-vault-files
        with:
          vault_deploy_key: ${{ secrets.VAULT_DEPLOY_KEY }}

      # #413: the vm-pilot protection tester (test-protection-data-driven.sh)
      # evaluates the Nix modules with nix-instantiate. Without nix on this
      # runner it printed a SKIP and exited 0, so the registry reported "ok"
      # for a tester that had never asserted anything — including the check
      # that the disk-watchdog's journal vacuum honours the retention floor.
      # nixpkgs on NIX_PATH because the tester imports <nixpkgs/lib>.
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # ── #368: the two steps that end the hand-maintained tester list ──────
      #
      # Every step above registers ONE tester by naming its filename. Writing a
      # tester and forgetting the step produced no error anywhere, so 44 of the
      # 101 testers under 9_others/test/ had never been executed — including
      # eight whose headers name a production incident and its run id. The list
      # is data now (9_others/test-registry.json). Add new testers THERE.
      - name: Phase 54 — every tester under 9_others/test/ is named by a runner
        # Runs BEFORE the registry so an unregistered tester is reported as
        # itself, not as a confusing absence further down.
        run: bash 9_others/test/test_every_tester_is_registered.sh
      - name: Phase 55 — the registered testers (data-driven, not a YAML list)
        # status "run" is fatal on failure; status "quarantine" is executed and
        # asserted to STILL fail, so a quarantine can never decay into a silent
        # skip. No continue-on-error here on purpose — a tester whose exit code
        # is swallowed is the defect this phase exists to undo.
        run: bash 9_others/test/run-registered-testers.sh
