name: vm-pilotd-test

# Go host daemon vm-pilotd (ticket #1876): vet, tests (including the parity harnesses that
# execute the real shell daemons: journal-ntfy.sh, load-shedder.nix main loop,
# watchdog-petter.sh, each with mutation checks), and a static cross-compile for both fleet
# architectures. Builds run here, never on the VMs. The binaries are uploaded as an artifact
# for the shadow roll-out.
on:
  push:
    branches: [main]
    paths:
      - 'b_infra/_shared/vm-pilot/src/vm-pilotd/**'
      - 'b_infra/_shared/vm-pilot/src/modules/scripts/journal-ntfy.sh'
      - 'b_infra/_shared/vm-pilot/src/modules/protection/load-shedder.nix'
      - 'b_infra/_shared/vm-pilot/src/modules/protection/watchdog-petter.sh'
      - '.github/workflows/vm-pilotd-test.yml'
  pull_request:
    paths:
      - 'b_infra/_shared/vm-pilot/src/vm-pilotd/**'
  workflow_dispatch:

# contents: write only so the release job can publish the binaries the Nix module pins.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: b_infra/_shared/vm-pilot/src/vm-pilotd
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: vet
        run: go vet ./...
      - name: tests (parity harnesses run the real shell sources)
        run: go test -count=1 -race -v ./...
      - name: static binaries (linux amd64 + arm64)
        run: |
          mkdir -p ../../../../../out
          for a in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -trimpath -ldflags='-s -w' -o ../../../../../out/vm-pilotd-linux-$a ./cmd/vm-pilotd
          done
          ls -l ../../../../../out
          file ../../../../../out/* || true
      - uses: actions/upload-artifact@v4
        with:
          name: vm-pilotd
          path: out/
          retention-days: 14
      # Release tag = id of the vm-pilotd source tree, so the same sources always map to the same
      # tag and agents/vm-pilotd.nix can pin it. Pushes to main only; an existing tag is left alone.
      - name: publish release asset (tag = source tree id)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TREE=$(git rev-parse HEAD:b_infra/_shared/vm-pilot/src/vm-pilotd)
          TAG="vm-pilotd-$(printf '%s' "$TREE" | cut -c1-12)"
          cd ../../../../../out
          for f in vm-pilotd-linux-amd64 vm-pilotd-linux-arm64; do sha256sum "$f" | sed "s#  .*#  $f#" > "$f.sha256"; done
          cat ./*.sha256
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists - leaving it"; exit 0; fi
          gh release create "$TAG" ./* --target "$GITHUB_SHA" --title "$TAG" \
            --notes "vm-pilotd shadow-stage binaries (ticket #1876), built from source tree $TREE by vm-pilotd-test.yml"
          echo "published $TAG"
