# ┌──────────────────────────────────────────────────────────────┐
# │  Ship services to VMs                                        │
# │                                                              │
# │  Thin GHA wrapper around ship.sh — all logic lives in the    │
# │  POSIX script, making it portable to Dagu, CLI, or any CI.   │
# │                                                              │
# │  Script: 1_cicd/src/scripts/ship.sh                       │
# └──────────────────────────────────────────────────────────────┘

name: Ship

# Two triggers, by intent:
#   push        → src/ change (code only) auto-ships immediately. gen-configs
#                 doesn't need to regen dist/ because no declaration changed.
#   workflow_run → declaration change (build.json, config.json, etc.) made
#                 gen-configs run; ship.yml waits for the new dist/ to land
#                 in origin/main, THEN ships from canonical truth.
# Manual workflow_dispatch always available.
on:
  push:
    paths:
      # a_solutions is DELIBERATELY ABSENT from this list and must stay that
      # way. On 2026-09-06 it stopped being a submodule and became a plain
      # sibling repository (diegonmarcos/cloudy-u-containers) that this repo
      # merely checks out. Nothing about a container change touches THIS
      # repository any more — not a file, not a gitlink — so no `paths:`
      # entry here, bare or globbed, can ever match one. Container changes
      # arrive on the `repository_dispatch` trigger below instead.
      # 1_cloud-configs/dist/build-*.json are the regenerated config files that
      # services in a_solutions/*/src/ symlink to (e.g.
      # bb-sec_caddy/src/build-caddy.json → ../../../1_cloud-configs/dist/build-caddy.json).
      # When the dist file regenerates (because someone edited
      # 9_others/src/), git records the content change on the dist file
      # path — the symlink itself is unchanged so `a_solutions/*/src/**`
      # would miss it. Adding the dist path here closes the gap; the detect
      # step (below) reverse-walks the symlinks to map changed dist files
      # back to their consuming services.
      - "1_cloud-configs/dist/build-*.json"
    branches: [main]
  workflow_run:
    workflows: ["Ship → gen-configs (cloud-data)"]
    types: [completed]
    branches: [main]
  # THE trigger for container changes, replacing the dead "a_solutions"
  # gitlink path filter. cloud-u-containers'
  # .github/workflows/dispatch-cloud-infra.yml fires this on every push to its
  # main and carries the pushed range in client_payload.{before,after}. Those
  # two SHAs are what per-service change detection diffs — see "Build VM
  # matrix" below. Without the payload the detect step has no honest base to
  # diff against and would either ship everything or ship nothing.
  repository_dispatch:
    types: [containers-push]
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated service dirs (e.g. bb-sec_caddy,bc-obs_ntfy) or 'all'"
        required: false
        default: "all"
      vm:
        description: "Target VM (e.g. gcp-proxy, oci-apps) or 'all'"
        required: false
        default: "all"

jobs:
  # ── Detect which VMs have changed services ──────────────────
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    # No job-level `if:` on the upstream conclusion. It used to skip detect
    # whenever gen-configs did not succeed, and a skipped detect is exactly
    # what the deploy gate (#401) must refuse — so every gen-configs run that
    # was merely SUPERSEDED (concurrency group gen-configs, cancel-in-progress)
    # turned its Ship red with no verdict (run 36703675956). The upstream
    # conclusion is now judged inside the path-relevance gate below.
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_vms: ${{ steps.matrix.outputs.has_vms }}
      # The deploy-gate's arbiter of WHY Build/Deploy were skipped. Values:
      #   ship             -> a deploy was required; gate demands success of both legs
      #   nothing-to-ship  -> detect positively proved nothing deployable changed; skip is correct
      #   empty            -> a containers-push diffed to zero deployable changes; NOT a proven no-op
      #   held             -> only auth-plane dirs changed and the #1886 hold kept them out; NOT green
      #   (absent)         -> the path-relevance gate skipped the matrix step; a declared no-op
      verdict: ${{ steps.matrix.outputs.verdict || steps.paths.outputs.verdict }}
      # Auth-plane dirs the #1886 hold took out of this Ship (space-separated, may be empty).
      held: ${{ steps.matrix.outputs.held }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 0, not 2: detect diffs across the whole push and needs its base commit.
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # a_solutions is its OWN repository (diegonmarcos/cloudy-u-containers),
      # NOT a submodule of this one (split out 2026-09-06). It is checked out
      # at the path every in-repo reference already uses, so nothing
      # downstream changes. fetch-depth: 0 — per-service change detection
      # walks its history. Both repos are public, so GITHUB_TOKEN suffices.
      - name: Checkout cloud-u-containers into a_solutions
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloudy-u-containers
          path: a_solutions
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pin EVERY job to the exact commit the dispatch announced, so the
          # tree that detect diffed is the tree that build and deploy ship.
          # Left unpinned, a container push landing mid-run would have detect
          # decide from commit X while the build job checked out a newer Y —
          # a silent mismatch between what was detected and what was shipped.
          # Empty on all other events, which checks out the default branch.
          ref: ${{ github.event.client_payload.after }}

      # Allowlist-based: `--init --recursive` aborts on the first submodule CI
      # cannot clone (vault/notes/cloud-data-lfs are private; cloud-master's
      # own .gitmodules is SSH-only). Ship needs cloud-data (configs) and unix
      # (cb_containers-builders/build.json — the builder-image master that the
      # resolve-builder-image action reads).
      - name: Init submodules (cloud-data + unix)
        uses: ./.github/actions/init-submodules
        with:
          include: I_cloud
          recursive: "true"
          cloud_data_deploy_key: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}

      # Path-relevance: skip if the upstream gen-configs commit didn't touch
      # 1_cloud-configs/dist/build-*.json (whose changes propagate to symlinked
      # consumers in a_solutions/*/src/).
      - name: Path relevance gate
        id: paths
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          # The a_solutions alternative that used to sit in this pattern is
          # gone: a_solutions is a separate repository now, so a workflow_run
          # commit in THIS repo can never contain an a_solutions path of any
          # shape. Only the regenerated dist files can appear here. Container
          # changes reach this workflow on repository_dispatch, which this
          # gate does not run for at all.
          #
          # Upstream conclusion first. `cancelled` on gen-configs means a newer
          # gen-configs run superseded it; that run regenerates dist/ from a
          # tree containing this one's trigger and fires its own Ship. It is
          # nothing-to-ship for THIS run only if the cancelled run landed
          # nothing on main — its commits say "via run <id>", so check.
          # Any other non-success means dist/ was not regenerated: fail.
          UP_ID="${{ github.event.workflow_run.id }}"
          UP_CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          case "$UP_CONCLUSION" in
            success) ;;
            cancelled)
              if git log origin/main --format='%h %s' --grep="via run ${UP_ID} " | grep .; then
                echo "::error::gen-configs run $UP_ID was cancelled AFTER landing the commit above on main — its dist/ changes have no Ship verdict. Re-run gen-configs."
                exit 1
              fi
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "verdict=nothing-to-ship" >> "$GITHUB_OUTPUT"
              echo "::notice::gen-configs run $UP_ID was superseded and landed nothing on main — nothing to ship; the superseding run's Ship carries the verdict"
              exit 0 ;;
            *)
              echo "::error::gen-configs run $UP_ID ended '$UP_CONCLUSION' — dist/ was not regenerated, so there is nothing trustworthy to detect from. Fix gen-configs."
              exit 1 ;;
          esac
          CHANGED=$(git diff --name-only HEAD^ HEAD 2>/dev/null \
              | grep -E '^1_cloud-configs/dist/build-' | head -1 || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::skip — no 1_cloud-configs/dist/build-* changes in upstream commit"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # NO local dist/ regen — gen-configs already ran first and committed
      # the canonical dist/ to origin/main, which actions/checkout pulled.

      # #564 — a container RENAME moves the generated dist/build-<container_name>.json
      # out from under every flake that reads the old name. #542 did it to three
      # services; one failed Build → oci-apps (and with it every VM's deploy in
      # run 35992310672), one was latent, one kept building from a frozen copy.
      # Runs on EVERY event so the containers-push that carries a rename is the
      # run that goes red, not whichever later push happens to rebuild it.
      - name: Guard — flake build-*.json refs are files dist/ still emits
        run: bash 9_others/test/test_flake_build_json_in_dist.sh

      - name: Build VM matrix
        id: matrix
        if: ${{ steps.paths.outputs.skip != 'true' }}
        # #1886 follow-up: event values come in through env so the run block
        # carries no expression. GitHub caps an expression-bearing string at
        # 21000 chars and this script is longer, so Ship failed to parse.
        env:
          SHIP_EVENT_NAME: ${{ github.event_name }}
          SHIP_INPUT_SERVICES: ${{ github.event.inputs.services }}
          SHIP_INPUT_VM: ${{ github.event.inputs.vm }}
          SHIP_EVENT_BEFORE: ${{ github.event.before }}
          SHIP_CP_AFTER: ${{ github.event.client_payload.after }}
          SHIP_CP_BEFORE: ${{ github.event.client_payload.before }}
        run: |
          # Reuse the portable detect logic from ship.sh
          # 2026-04-27 migrated: cloud-data-gha-config.json -> build-gha.json
          # (per-service build-{name}.json convention; derived from
          # _cloud-data-consolidated.json by 1_cloud-configs/src/derive/cloud-data-config-derive.ts).
          # Legacy paths kept as fallbacks during rollout.
          GHA_CONFIG=""
          for _p in \
              "/app/build-gha.json" \
              "${CLOUD_ROOT:-$PWD}/1_cloud-configs/dist/build-gha.json" \
              "${CLOUD_ROOT:-$PWD}/cloud-data/build-gha.json" \
              "${CLOUD_ROOT:-$PWD}/build-gha.json"; do
              [ -f "$_p" ] && { GHA_CONFIG="$_p"; break; }
          done
          if [ -z "$GHA_CONFIG" ]; then
              # Fallback: extract _gha slice from consolidated.
              _CONS=""
              for _p in \
                  "/app/_cloud-data-consolidated.json" \
                  "${CLOUD_ROOT:-$PWD}/1_cloud-configs/dist/_cloud-data-consolidated.json" \
                  "${CLOUD_ROOT:-$PWD}/cloud-data/_cloud-data-consolidated.json" \
                  "${CLOUD_ROOT:-$PWD}/_cloud-data-consolidated.json"; do
                  [ -f "$_p" ] && { _CONS="$_p"; break; }
              done
              if [ -n "$_CONS" ]; then
                  echo "::warning::build-gha.json not found; deriving from $_CONS — run 9_others/build.sh to materialise the canonical file."
                  GHA_CONFIG="${RUNNER_TEMP:-/tmp}/gha-config.json"
                  jq '
                    ._gha as $g
                    | (.vms | to_entries | map({key: .value.ssh_alias, value: .value.wg_ip}) | from_entries) as $alias_to_wg
                    | $g
                    | .vms |= with_entries(.value += {wg_ip: ($alias_to_wg[.key] // null)})
                  ' "$_CONS" > "$GHA_CONFIG"
              fi
          fi
          [ -n "$GHA_CONFIG" ] || { echo "::error::build-gha.json not found and no consolidated fallback available — run 9_others/build.sh" >&2; exit 1; }

          # ── Resolve args from GHA inputs ──
          if [ "${SHIP_EVENT_NAME}" = "workflow_dispatch" ]; then
            INPUT_SERVICES="${SHIP_INPUT_SERVICES}"
            INPUT_VM="${SHIP_INPUT_VM}"
            if [ "$INPUT_SERVICES" = "all" ] && [ "$INPUT_VM" = "all" ]; then
              CHANGED_DIRS=""; VM_FILTER=""
            elif [ "$INPUT_SERVICES" != "all" ]; then
              CHANGED_DIRS=$(printf '%s' "$INPUT_SERVICES" | tr ',' ' '); VM_FILTER=""
            else
              CHANGED_DIRS=""; VM_FILTER="$INPUT_VM"
            fi
            # #1886: services=all is a fan-out, so it never carries the auth
            # plane (1_cicd/src/ship-auth-plane.json); name those dirs to ship
            # them. "All" is spelled out as the registry (filtered to the VM
            # when one is given) so the hold can take them out of it.
            if [ "$INPUT_SERVICES" = "all" ]; then
              ALL_DIRS=$(jq -r --arg vm "$VM_FILTER" '.services | to_entries[] | select($vm == "" or .value.vm == $vm) | .value.dir' "$GHA_CONFIG" | sort -u | tr '\n' ' ')
              CHANGED_DIRS=$(SHIP_CANDIDATES="$ALL_DIRS" SHIP_DIRECT="" bash 1_cicd/src/scripts/cloud-ship-guard-auth-plane.sh auto)
            else
              CHANGED_DIRS=$(SHIP_CANDIDATES="$CHANGED_DIRS" bash 1_cicd/src/scripts/cloud-ship-guard-auth-plane.sh explicit)
            fi
          else
            # Pathspec NOTE: `a_solutions/*/src/` (with trailing slash) is
            # interpreted by git as a directory pathspec that DOES NOT recurse
            # into nested files like src/code/arm64/Dockerfile (verified 2026-06-05
            # commit dbaf52371 — Dockerfile change missed by detect, matrix
            # emitted empty, Ship → <matrix.vm> reported "skipped" even
            # though the source changed and warranted a rebuild). The fix is to
            # use a recursive glob: `**` matches at any depth under src/.
            # Diff across the WHOLE push, not just its tip.
            #
            # This was `HEAD~1 HEAD`, which only ever examined the last commit.
            # Push two commits at once and every service touched by the earlier
            # one was silently dropped — the run still went green, having
            # deployed a strict subset of what changed. That is how the
            # c3-public-api fix that stops inbound mail being rate-limited sat
            # committed-but-undeployed on 2026-08-24 behind a successful Ship.
            #
            # github.event.before is the push's base. It is absent on non-push
            # events, all-zeros on a branch's first push, and may name a
            # discarded commit after a force-push — fall back to HEAD~1 in all
            # three cases rather than diffing against nothing.
            BASE="${SHIP_EVENT_BEFORE}"
            if [ "$GITHUB_EVENT_NAME" != "push" ] \
               || [ -z "$BASE" ] \
               || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE="HEAD~1"
            fi
            echo "detect: diffing $BASE..HEAD"
            # a_solutions is a SEPARATE REPOSITORY (since 2026-09-06), not a
            # submodule. There is no gitlink in this repo to diff any more, so
            # the superproject diff above can NEVER report a container change:
            # `git diff -- a_solutions` matches nothing because the path is not
            # tracked here at all. The base/head pair now comes from the
            # repository_dispatch payload that cloud-u-containers sends on
            # every push, and the diff is taken INSIDE the a_solutions checkout
            # against its own history (fetch-depth: 0 above guarantees both
            # commits are present).
            #
            # The failure this guards against is unchanged and is the whole
            # reason the payload carries `before` rather than assuming HEAD^:
            # a push of two commits diffed as HEAD^..HEAD silently drops every
            # service touched by the earlier one, and the run still goes green
            # having deployed a strict subset. Same bug that left the
            # c3-public-api mail fix committed-but-undeployed on 2026-08-24.
            SUB_CHANGED=""
            if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
              NEW_SUB="${SHIP_CP_AFTER}"
              OLD_SUB="${SHIP_CP_BEFORE}"
              # No head SHA means the dispatch itself is malformed. Shipping
              # "whatever main happens to be" from here would decouple what was
              # detected from what was announced — fail loudly instead.
              if [ -z "$NEW_SUB" ] || ! git -C a_solutions cat-file -e "${NEW_SUB}^{commit}" 2>/dev/null; then
                echo "::error::repository_dispatch client_payload.after is missing or not present in the cloud-u-containers checkout (after='$NEW_SUB') — refusing to ship a silent subset"
                exit 1
              fi
              # `before` is all-zeros on a branch's first push and may name a
              # discarded commit after a force-push. Fall back to the parent
              # of `after` in those cases — the same fallback the superproject
              # BASE resolution above applies to github.event.before.
              if [ -z "$OLD_SUB" ] \
                 || [ "$OLD_SUB" = "0000000000000000000000000000000000000000" ] \
                 || ! git -C a_solutions cat-file -e "${OLD_SUB}^{commit}" 2>/dev/null; then
                echo "::warning::client_payload.before unusable (before='$OLD_SUB') — falling back to ${NEW_SUB}^"
                OLD_SUB=$(git -C a_solutions rev-parse --verify --quiet "${NEW_SUB}^" || true)
                [ -n "$OLD_SUB" ] || { echo "::error::cannot resolve a base commit for a_solutions — refusing to ship a silent subset"; exit 1; }
              fi
              SUB_CHANGED=$(git -C a_solutions diff --name-only "$OLD_SUB" "$NEW_SUB")
              echo "detect: a_solutions ${OLD_SUB}..${NEW_SUB}"
              # An announced container push that resolves to zero changed files
              # is a contradiction, and the empty-matrix early exit below would
              # turn it into a green run that shipped nothing — precisely the
              # false-green this block exists to prevent. Say so out loud.
              [ -n "$SUB_CHANGED" ] || echo "::warning::containers-push dispatch ${OLD_SUB}..${NEW_SUB} produced an EMPTY diff — nothing will ship"
            fi

            # build.json drives the image (docker.native_build -> Dockerfile.native)
            # and compose but sits ABOVE src/. a57935adb (2026-08-26) changed only
            # cloud-cgc-pub-mcp/build.json and mapped to NO service: Build/Deploy
            # skipped, run green, consumer never rebuilt.
            # Paths are submodule-relative ("<svc>/src/..."), so the service
            # name is field 1, not field 2 as it was superproject-relative.
            # #862: dist/ too. A push touching only a committed dist/ used to map
            # to no service and end in verdict 'empty' (red). Shipping it is
            # cheap and honest: the build re-renders dist/ from src/ (never
            # deploys the committed copy) and step_verify_committed_dist fails
            # the build if the committed dist/ is not that render.
            CHANGED_DIRS=$(printf '%s\n' "$SUB_CHANGED" | grep -E '^[^/]+/(src/|dist/|build\.json$)' \
              | awk -F/ '{print $1}' | sort -u | tr '\n' ' ' || true)
            # Dirs whose OWN files changed: the only way an auth-plane service
            # ships without being named (cloud-ship-guard-auth-plane.sh, #1886).
            DIRECT_DIRS="$CHANGED_DIRS"

            # A service can consume ANOTHER service's src file through a symlink
            # (tools-maddy/src/mail-rules-general.json -> tools-stalwart's). git
            # reports only the real path, so the consuming service never rebuilt
            # (a mail-rules edit on 2026-08-24 shipped tools-stalwart and left
            # tools-maddy serving stale rules behind a green run). Same reverse-
            # walk as the dist-consumer case below, over changed src files:
            # derive from the in-submodule diff, re-prefix to superproject-
            # relative paths, compare against readlink targets under $PWD.
            SRC_CHANGED=$(printf '%s\n' "$SUB_CHANGED" | grep -E '^[^/]+/src/' \
              | sed 's|^|a_solutions/|' || true)
            SRC_CONSUMERS=""
            # 2026-09-06: walk every symlink under src/ (any depth, not just
            # src/*), and match a changed file that IS the target or lives
            # INSIDE a symlinked directory's target. cloud-infra-mcp consumes
            # c3-infra-api's shared libs through
            # src/code/shared -> ../../../infra-api_c3-infra-api/src/code/shared;
            # the one-level exact-match walk never saw that, so every shared-lib
            # fix shipped c3-infra-api (no build.sh: SKIP) and left the MCP on
            # old code behind a green run (34037092235). Link list resolved
            # once, matched per changed file.
            _LINKS_TSV="$RUNNER_TEMP/src-symlinks.tsv"
            find a_solutions/*/src -maxdepth 4 -type l \
              -not -path '*/node_modules/*' -not -path '*/dist/*' 2>/dev/null \
              | while IFS= read -r _link; do
                  _t="$(readlink -f "$_link" 2>/dev/null || true)"
                  [ -n "$_t" ] && printf '%s\t%s\n' "$_t" "$(echo "$_link" | awk -F/ '{print $2}')"
                done > "$_LINKS_TSV" || true
            for _sf in $SRC_CHANGED; do
              _sf_abs="$PWD/$_sf"
              while IFS=$'\t' read -r _t _svc; do
                case "$_sf_abs" in
                  "$_t"|"$_t"/*) SRC_CONSUMERS="$SRC_CONSUMERS $_svc" ;;
                esac
              done < "$_LINKS_TSV"
            done
            if [ -n "$SRC_CONSUMERS" ]; then
              CHANGED_DIRS=$(printf '%s %s\n' "$CHANGED_DIRS" "$SRC_CONSUMERS" \
                | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
              echo "::notice::src-symlink consumer ship:$SRC_CONSUMERS"
            fi

            # A change under _shared/ ships its consumers: every engine consumer for the engine and
            # what it reads, only the declared readers for a data file, nothing for tests/docs (#1886).
            ENGINE_CONSUMERS=$(printf '%s\n' "$SUB_CHANGED" | bash 1_cicd/src/scripts/cloud-ship-detect-engine-consumers.sh || true)
            CHANGED_DIRS=$(printf '%s %s\n' "$CHANGED_DIRS" "$ENGINE_CONSUMERS" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')

            # Also pick up consumers of regenerated 1_cloud-configs/dist/build-*.json:
            # reverse-walk each service's src/ symlinks to a changed dist file
            # and append the owner to CHANGED_DIRS. Not on repository_dispatch —
            # that event claims nothing about THIS repo's $BASE..HEAD, so
            # diffing it would attribute someone else's dist edit to a
            # container push and ship services that did not change.
            DIST_CHANGED=""
            if [ "$GITHUB_EVENT_NAME" != "repository_dispatch" ]; then
              DIST_CHANGED=$(git diff --name-only "$BASE" HEAD -- '1_cloud-configs/dist/build-*.json' 2>/dev/null)
            fi
            if [ -n "$DIST_CHANGED" ]; then
              # The reverse-walk that used to be inlined here now lives in
              # cloud-ship-detect-dist-consumers.sh, which prints its reasoning
              # to stderr and only the services to ship on stdout. It was moved
              # for two reasons.
              #
              # It was file-granular and the derived dist files are not: the
              # derive step stamps a fleet-wide cross-service registry (the
              # `services` block) into EVERY build-*.json, so 96e362760
              # (registering two unrelated MCP endpoints) rewrote 115 of them,
              # 104 differing in nothing else, and this walk read "the file
              # changed" as "the service changed". 43 services redeployed on
              # oci-apps, cloud-ide among them, whose compose.nix never reads
              # the registry. And it was unassertable while inline — no way to
              # feed it a synthetic commit — so neither direction was ever
              # proven. 9_others/test/test_detect_dist_consumers.sh now does.
              DIST_CONSUMERS=$(bash 1_cicd/src/scripts/cloud-ship-detect-dist-consumers.sh "$BASE" HEAD || true)
              CHANGED_DIRS=$(printf '%s %s\n' "$CHANGED_DIRS" "$DIST_CONSUMERS" \
                | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')

              # Also deploy newly-registered services: present in HEAD's
              # build-gha.json but absent in HEAD~1's. This fires when a new
              # service is registered via 1_cloud-configs/src/inputs/builds/ symlink →
              # gen-configs updates build-gha.json → Ship triggered by
              # workflow_run but finds no a_solutions/*/src/** changes in HEAD
              # (gen-configs only touches 1_cicd/dist/). Without this, new
              # services silently skip their first deploy.
              GHA_REL="${GHA_CONFIG#$PWD/}"
              NEW_SVCS=$(diff \
                <(git show HEAD~1:"$GHA_REL" 2>/dev/null | jq -r '.services[].dir' 2>/dev/null || true) \
                <(jq -r '.services[].dir' "$GHA_CONFIG" 2>/dev/null || true) \
                | awk '/^>/{print $2}' | tr '\n' ' ')
              if [ -n "$NEW_SVCS" ]; then
                CHANGED_DIRS=$(printf '%s %s\n' "$CHANGED_DIRS" "$NEW_SVCS" \
                  | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
                echo "::notice::newly registered services: $NEW_SVCS"
              fi
            fi

            # #1886: hold the auth plane out of every fan-out. It stays only when
            # its own directory changed in a small push; otherwise it waits for
            # an explicit, approved workflow_dispatch naming it.
            HELD_FILE="$RUNNER_TEMP/auth-plane-held"
            CHANGED_DIRS=$(SHIP_CANDIDATES="$CHANGED_DIRS" SHIP_DIRECT="$DIRECT_DIRS" SHIP_HELD_OUT="$HELD_FILE" \
              bash 1_cicd/src/scripts/cloud-ship-guard-auth-plane.sh auto)
            HELD=$(cat "$HELD_FILE" 2>/dev/null || true)
            echo "held=$HELD" >> "$GITHUB_OUTPUT"

            VM_FILTER=""
            if [ -z "$CHANGED_DIRS" ]; then
              echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
              echo "has_vms=false" >> "$GITHUB_OUTPUT"
              # Only auth-plane services changed and all were held: not a
              # detection miss and not a no-op. verdict=held fails the gate
              # with the exact dispatch that ships them once approved.
              if [ -n "$HELD" ]; then
                echo "verdict=held" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # #401 (#176, third recurrence): why is this a SKIP, and is that
              # skip proven? On repository_dispatch a container push that diffs
              # to zero deployable changes is not a proven no-op — it is either a
              # detection miss or a non-service change infra still needs to be
              # told about. Tag it verdict=empty so the gate catches it and the
              # run cannot conclude success with Build/Deploy skipped (run
              # 35146335744 reported exactly that hollow green). On push /
              # workflow_run the same empty set IS genuinely nothing-to-do (the
              # gen-configs dist refresh landing as a no-op), so it stays green.
              #
              # Exception: only no-deploy paths (_dispatch/) = proven no-op.
              if [ "${SHIP_EVENT_NAME}" = "repository_dispatch" ] \
                 && ! printf '%s\n' "$SUB_CHANGED" | bash 1_cicd/src/scripts/cloud-ship-detect-nodeploy-only.sh; then
                echo "verdict=empty" >> "$GITHUB_OUTPUT"
              else
                echo "verdict=nothing-to-ship" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
          fi

          # ── Per-VM hosted-runner selection (native, no QEMU) ──
          # Each Ship job builds its VM's Docker images on the GHA runner it
          # runs on (build.json .runners.<arch>.type = "local"). So the runner
          # arch MUST match the target VM's arch: aarch64 VMs (oci-apps) →
          # ubuntu-24.04-arm; x86_64 VMs → ubuntu-latest. Authoritative arch
          # source is .vms[].specs.arch in _cloud-data-consolidated.json,
          # keyed by the VM's ssh_alias (== the matrix `vm` value). We build an
          # ssh_alias→runner map here and attach a `runner` field to every
          # matrix entry; ship.runs-on reads <matrix.runner>. Any VM not
          # found in the map defaults to ubuntu-latest (x86) — safe, because
          # the only arm64 VM is oci-apps and it is present in the map.
          _CONS_FOR_ARCH=""
          for _p in \
              "/app/_cloud-data-consolidated.json" \
              "${CLOUD_ROOT:-$PWD}/1_cloud-configs/dist/_cloud-data-consolidated.json" \
              "${CLOUD_ROOT:-$PWD}/cloud-data/_cloud-data-consolidated.json" \
              "${CLOUD_ROOT:-$PWD}/_cloud-data-consolidated.json"; do
              [ -f "$_p" ] && { _CONS_FOR_ARCH="$_p"; break; }
          done
          if [ -n "$_CONS_FOR_ARCH" ]; then
            RUNNER_MAP=$(jq -c '
              .vms | to_entries
              | map({
                  key: .value.ssh_alias,
                  value: (if (.value.specs.arch // "") == "aarch64"
                          then "ubuntu-24.04-arm" else "ubuntu-latest" end)
                })
              | from_entries
            ' "$_CONS_FOR_ARCH")
          else
            echo "::warning::_cloud-data-consolidated.json not found — all Ship jobs default to ubuntu-latest (x86). arm64 VMs will build cross-arch and may fail."
            RUNNER_MAP='{}'
          fi

          # ── Per-VM self-hosted runner label (PLAN-ghcr-artifacts.md item 4) ──
          # Optional vms.<host>.runner_label in config.json, propagated through
          # to $GHA_CONFIG's .vms[alias].runner_label by the consolidator.
          # Attached to every matrix entry as `runner_label` (empty string when
          # absent) — the SAME $GHA_CONFIG this step already loaded, no new
          # file to fail-open on. deploy.runs-on falls back to ubuntu-latest +
          # the mesh/WireGuard path whenever it's empty; that fallback (not a
          # value written here) is what keeps "no label set" behaviour-neutral.
          RUNNER_LABEL_MAP=$(jq -c '.vms | with_entries(.value = (.value.runner_label // ""))' "$GHA_CONFIG")

          # ── Build matrix JSON ──
          MATRIX_JSON=$(jq -c \
            --arg changed "$CHANGED_DIRS" --arg vm_filter "$VM_FILTER" \
            --argjson runner_map "$RUNNER_MAP" --argjson runner_label_map "$RUNNER_LABEL_MAP" '
            ($changed | split(" ") | map(select(. != ""))) as $cl |
            .services | to_entries | group_by(.value.vm)
            | map({
                vm: .[0].value.vm,
                changed: ([.[] | .value.dir] as $a |
                  if ($cl | length) == 0 then "" else [$cl[] | select(. as $d | $a | any(. == $d))] | join(" ") end)
              })
            | map(select(($vm_filter == "" or .vm == $vm_filter) and (($cl | length) == 0 or (.changed | length) > 0)))
            | map({vm: .vm, changed_dirs: .changed, runner: ($runner_map[.vm] // "ubuntu-latest"), runner_label: ($runner_label_map[.vm] // "")})
          ' "$GHA_CONFIG")

          echo "matrix={\"include\":$MATRIX_JSON}" >> "$GITHUB_OUTPUT"
          COUNT=$(printf '%s' "$MATRIX_JSON" | jq 'length')
          if [ "$COUNT" -gt 0 ]; then
            echo "has_vms=true" >> "$GITHUB_OUTPUT"
            echo "verdict=ship" >> "$GITHUB_OUTPUT"
          else
            # Zero VMs with a non-empty CHANGED_DIRS: either every changed dir is
            # unregistered (shipped by another workflow: infra-obs_reports via
            # ship-reports.yml, user-web_front-end via ship-wrangler.yml) — a
            # proven no-op — or a registered dir resolves to no VM, which the
            # guard below turns into a detect FAILURE. Only the former survives
            # to success, so nothing-to-ship is the honest verdict here.
            echo "has_vms=false" >> "$GITHUB_OUTPUT"
            echo "verdict=nothing-to-ship" >> "$GITHUB_OUTPUT"
          fi
          echo "VMs: $COUNT — $(printf '%s' "$MATRIX_JSON" | jq -r '.[].vm' | tr '\n' ' ')"

          # ── Guard: an explicit dispatch that matches nothing is a typo, not a no-op ──
          # `services` takes the a_solutions DIRECTORY name. An unknown name used to
          # yield an empty matrix -> has_vms=false -> ship job skipped -> run reports
          # SUCCESS while deploying nothing. Fail loudly instead, naming the misses.
          # The service→dir registry both zero-VM guards below judge
          # CHANGED_DIRS against. Resolved once, from $GHA_CONFIG, because
          # two copies of this lookup would be two things to keep in step.
          KNOWN=$(jq -r '.services | to_entries[] | .value.dir' "$GHA_CONFIG" | sort -u)

          if [ "${SHIP_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "$CHANGED_DIRS" ]; then
            UNKNOWN=""
            for d in $CHANGED_DIRS; do
              printf '%s\n' "$KNOWN" | grep -qxF "$d" || UNKNOWN="$UNKNOWN $d"
            done
            if [ -n "$UNKNOWN" ]; then
              echo "::error::Unknown service dir(s):$UNKNOWN"
              echo "::error::'services' expects the a_solutions directory name (e.g. infra-api_google-workspace-mcp)."
              printf '%s\n' "$KNOWN" | sed 's/^/  known: /'
              exit 1
            fi
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::Requested [$CHANGED_DIRS] resolved to 0 VMs — nothing would deploy."
              exit 1
            fi
          fi

          # ── Guard: distinguish "nothing to do" from "could not tell what to do" ──
          # On every event OTHER than workflow_dispatch, CHANGED_DIRS comes
          # from a real diff, so a dir missing from the registry is NOT a typo
          # — it is a directory that is not a deployable container service.
          # infra-obs_reports ships via ship-reports.yml and user-web_front-end
          # via ship-wrangler.yml; a containers-push touching only those is an
          # honest no-op and must stay green (run 34335628332 was exactly that:
          # "detect: a_solutions 902bbba9..83c4a1fb", CHANGED_DIRS
          # "infra-obs_reports", VMs: 0). What that run could not say is WHY it
          # shipped nothing, and an unexplained "VMs: 0 —" is indistinguishable
          # from a broken mapping. Name the reason so it never is again.
          #
          # A dir that IS registered and still resolves to zero VMs is the
          # other case entirely: the service→vm mapping is broken and the run
          # is about to report success for a deploy that ships nothing. That is
          # the failure mode that hid a57935adb (cloud-cgc-pub-mcp/build.json,
          # 2026-08-26) behind a green run. Fail instead.
          if [ "${SHIP_EVENT_NAME}" != "workflow_dispatch" ] \
             && [ "$COUNT" -eq 0 ] && [ -n "$CHANGED_DIRS" ]; then
            UNREGISTERED=""; REGISTERED=""
            for d in $CHANGED_DIRS; do
              if printf '%s\n' "$KNOWN" | grep -qxF "$d"; then
                REGISTERED="$REGISTERED $d"
              else
                UNREGISTERED="$UNREGISTERED $d"
              fi
            done
            if [ -n "$UNREGISTERED" ]; then
              echo "::notice::changed but not a deployable container service (shipped by another workflow, nothing to do here):$UNREGISTERED"
            fi
            if [ -n "$REGISTERED" ]; then
              echo "::error::registered service(s)$REGISTERED changed but resolved to 0 VMs — the service→vm mapping in build-gha.json is broken. Refusing to report success for a deploy that would ship nothing."
              exit 1
            fi
          fi

  # ── Build: one matrix job per VM, build+push images only ─────
  # PLAN-ghcr-artifacts.md item 2: split off deploy so a build's mesh-free
  # docker/GHCR work never contends with deploy's single WG peer slot (the
  # cause of concurrent-run mesh steals — see plan "Why"), and so a bad
  # config/secrets/compose-up on ONE host can't be blamed on the build that
  # produced a perfectly good image. Same per-service engine, different verb
  # (see cloud-ship-container-engine.sh's `ship-build` and
  # cloud-ship-ci-builder-dispatch.sh's SHIP_MODE=build) — never touches
  # deploy.host/DEPLOY_PATH/the VM/the mesh at all.
  build:
    name: "Build → ${{ matrix.vm }}"
    needs: detect
    if: needs.detect.outputs.has_vms == 'true'
    # Per-VM native runner: aarch64 VMs (oci-apps) → ubuntu-24.04-arm so their
    # Docker images build natively (build.json .runners.arm64.type=local, no
    # QEMU, no SSH dispatch to oci-apps); x86_64 VMs → ubuntu-latest. The
    # `runner` field is set per matrix entry in the detect job from the VM's
    # specs.arch. Defaults to ubuntu-latest if a VM is missing from the map.
    # KEPT (not flattened to ubuntu-latest) — arm64 image builds depend on
    # this native match; step_docker's alternate "ssh"-dispatch runner type
    # exists but 1_cloud-configs/src/inputs/cloud-builders-runner.json still
    # declares arm64 as type=local, so flattening here would silently cross-
    # arch build on an amd64 host with no QEMU (this repo's doctrine is FAIL
    # LOUD on that, not paper over it with emulation).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
      # No max-parallel here (unlike deploy, below): the WG-peer-slot
      # contention that forced serialization never applies to build — no
      # WG_PRIVATE_KEY is passed into this job at all (see the Ship step),
      # so builds for every host can run fully in parallel.
    env:
      # Still passed: the ONE existing multi-arch service (claude-superset-api)
      # needs an SSH-reachable cross-arch builder even in build-only mode
      # (cloud-ship-ci-builder-dispatch.sh's runner-warmup section), and
      # "Resolve SSH credentials" below writes ~/.ssh/config unconditionally.
      # No WG_PRIVATE_KEY — that is what makes this job mesh-free: the
      # cloud-builder entrypoint gates its entire wg-quick block on that var
      # being set, so omitting it here (rather than in a workflow `if:`)
      # keeps the "no WireGuard" behaviour enforced by the same engine every
      # other caller (Dagu, CLI) already trusts, not a GHA-only special case.
      OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
      GCP_PROXY_SSH_KEY: ${{ secrets.GCP_PROXY_SSH_KEY }}
      GCP_PROXY_HOST: ${{ secrets.GCP_PROXY_HOST }}
      GCP_PROXY_USER: ${{ secrets.GCP_PROXY_USER }}
      GCP_T4_SSH_KEY: ${{ secrets.GCP_T4_SSH_KEY }}
      GCP_T4_HOST: ${{ secrets.GCP_T4_HOST }}
      GCP_T4_USER: ${{ secrets.GCP_T4_USER }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      # a_solutions is its OWN repository (diegonmarcos/cloudy-u-containers),
      # NOT a submodule of this one (split out 2026-09-06). It is checked out
      # at the path every in-repo reference already uses, so nothing
      # downstream changes. fetch-depth: 0 — per-service change detection
      # walks its history. Both repos are public, so GITHUB_TOKEN suffices.
      - name: Checkout cloud-u-containers into a_solutions
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloudy-u-containers
          path: a_solutions
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pin EVERY job to the exact commit the dispatch announced, so the
          # tree that detect diffed is the tree that build and deploy ship.
          # Left unpinned, a container push landing mid-run would have detect
          # decide from commit X while the build job checked out a newer Y —
          # a silent mismatch between what was detected and what was shipped.
          # Empty on all other events, which checks out the default branch.
          ref: ${{ github.event.client_payload.after }}

      # Allowlist-based: `--init --recursive` aborts on the first submodule CI
      # cannot clone (vault/notes/cloud-data-lfs are private; cloud-master's
      # own .gitmodules is SSH-only). Ship needs cloud-data (configs) and unix
      # (cb_containers-builders/build.json — the builder-image master that the
      # resolve-builder-image action reads).
      - name: Init submodules (cloud-data + unix)
        uses: ./.github/actions/init-submodules
        with:
          include: I_cloud
          recursive: "true"
          cloud_data_deploy_key: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}

      # QEMU binfmt — ONLY on the arm64 runner, and ONLY needed by the single
      # multi-arch service (claude-superset-api, docker.arch="amd64,arm64",
      # deploys to oci-apps/arm64). Its arm64 leg builds natively on this arm
      # runner; its amd64 leg is built here via emulation. Every OTHER service
      # is single-arch and builds natively on its arch-matching runner, so this
      # step is a cheap no-op (binfmt registration) for them. x86 runners never
      # hit this — their only cross-arch need (arm64) was the reason we moved
      # arm64 to its own native runner in the first place. If claude-superset-api
      # is ever made arm64-only, this step can be dropped entirely.
      - name: Set up QEMU (arm runner only — for the one multi-arch service's amd64 leg)
        if: runner.arch == 'ARM64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      # Always regenerate dist/build-{name}.json + cloud-data-*.json from
      # build.json sources. Each build job runs against fresh data —
      # the bundled dist/ files in the image come from THIS step, not
      # from the cloud repo's HEAD checkout.
      # 9_others/build.sh self-bootstraps tsx + yaml + nunjucks if missing
      # (engine-side ensure_node_deps — fix lives in the engine, not here).
      - name: Regenerate dist/ from build.json sources
        run: |
          # Two engines since the 1_cloud-configs split: 9_others renders the
          # repo's own config (workflows, hooks, git dotfiles), 1_cloud-configs
          # derives every build-*.json the services consume. This step needs
          # the latter; the former is already committed by ship-gen-configs.
          # URL scheme: the derive reads cloud-u-android's generated
          # 2_configs/apk-manifest.json from the sibling checkout
          # (a0_docs/eng-specs/url-scheme.md). Sparse + blobless: only that file.
          if [ ! -f "$(dirname "$GITHUB_WORKSPACE")/cloud-u-android/2_configs/apk-manifest.json" ]; then
            rm -rf "$(dirname "$GITHUB_WORKSPACE")/cloud-u-android"
            GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none --sparse \
              https://github.com/diegonmarcos/cloudy-u-android.git "$(dirname "$GITHUB_WORKSPACE")/cloud-u-android"
            git -C "$(dirname "$GITHUB_WORKSPACE")/cloud-u-android" sparse-checkout set 2_configs
          fi
          bash 1_cloud-configs/build.sh all

      # Vault clone — provides ~/git/cloud-vault/vault-keys-docker.envfile that
      # cloud-builder's compose.yaml references via env_file:. Without it,
      # `docker compose run cloud-builder` aborts: "env file ... not found".
      - name: Fetch vault
        uses: ./.github/actions/fetch-vault
        with:
          vault_deploy_key: ${{ secrets.VAULT_DEPLOY_KEY }}

      # ── Cache warming: cargo registry/git + target dir ─────────────────
      # Rust services (fin-api, mail-puller, rig-agentic-*, http-to-smtp-proxy-api)
      # run a host-side `cargo build` inside cloud-builder. Without cache,
      # every build re-downloads ~500MB of crates and recompiles from scratch
      # (5-10 min per service). We restore ~/.cargo/{registry,git} keyed on
      # all Cargo.lock files in the repo, plus a per-arch shared target/
      # dir at $RUNNER_TEMP/cargo-target. Mounted into cloud-builder at
      # /root/.cargo and /cargo-target via -v flags in the run step below.
      - name: Restore Rust cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/cargo-target
          key: ${{ runner.os }}-cargo-${{ matrix.vm }}-${{ hashFiles('a_solutions/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.vm }}-
            ${{ runner.os }}-cargo-

      # ── Cache warming: pre-pull cloud-builder image (single docker layer pull) ──
      - name: Prepare cloud-builder + cache mounts
        run: |
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git" "${{ runner.temp }}/cargo-target"
          # Avoid permission churn on cache restore — cloud-builder runs as root
          chmod -R a+rwX "$HOME/.cargo" "${{ runner.temp }}/cargo-target" 2>/dev/null || true

      - name: Resolve builder image
        uses: ./.github/actions/resolve-builder-image

      - name: Resolve SSH credentials
        id: ssh
        run: |
          # 2026-04-27 migrated: cloud-data-gha-config.json -> build-gha.json
          GHA_CONFIG=""
          for _p in \
              "/app/build-gha.json" \
              "${CLOUD_ROOT:-$PWD}/1_cloud-configs/dist/build-gha.json" \
              "${CLOUD_ROOT:-$PWD}/cloud-data/build-gha.json" \
              "${CLOUD_ROOT:-$PWD}/build-gha.json"; do
              [ -f "$_p" ] && { GHA_CONFIG="$_p"; break; }
          done
          if [ -z "$GHA_CONFIG" ]; then
              # Fallback: extract _gha slice from consolidated.
              _CONS=""
              for _p in \
                  "/app/_cloud-data-consolidated.json" \
                  "${CLOUD_ROOT:-$PWD}/1_cloud-configs/dist/_cloud-data-consolidated.json" \
                  "${CLOUD_ROOT:-$PWD}/cloud-data/_cloud-data-consolidated.json" \
                  "${CLOUD_ROOT:-$PWD}/_cloud-data-consolidated.json"; do
                  [ -f "$_p" ] && { _CONS="$_p"; break; }
              done
              if [ -n "$_CONS" ]; then
                  echo "::warning::build-gha.json not found; deriving from $_CONS — run 9_others/build.sh to materialise the canonical file."
                  GHA_CONFIG="${RUNNER_TEMP:-/tmp}/gha-config.json"
                  jq '
                    ._gha as $g
                    | (.vms | to_entries | map({key: .value.ssh_alias, value: .value.wg_ip}) | from_entries) as $alias_to_wg
                    | $g
                    | .vms |= with_entries(.value += {wg_ip: ($alias_to_wg[.key] // null)})
                  ' "$_CONS" > "$GHA_CONFIG"
              fi
          fi
          [ -n "$GHA_CONFIG" ] || { echo "::error::build-gha.json not found and no consolidated fallback available — run 9_others/build.sh" >&2; exit 1; }
          VM="${{ matrix.vm }}"
          # All VMs (including gcp-proxy) reach the runner via WG IP. Public
          # :22 on gcp-proxy is closed by host iptables since the public-surface
          # collapse (2026-05-08) — only :443/:51820/:25 are exposed. Falling
          # through to the cloud-data lookup gives wg_ip=10.0.0.1.
          case "$VM" in
            *)         KEY="$OCI_SSH_KEY"
                       HOST=$(jq -r --arg vm "$VM" '.vms[$vm].wg_ip // .vms[$vm].host' "$GHA_CONFIG")
                       USER=$(jq -r --arg vm "$VM" '.vms[$vm].user' "$GHA_CONFIG") ;;
          esac
          echo "ssh_key<<EOFKEY" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$KEY"  >> "$GITHUB_OUTPUT"
          echo "EOFKEY"         >> "$GITHUB_OUTPUT"
          echo "ssh_host=$HOST" >> "$GITHUB_OUTPUT"
          echo "ssh_user=$USER" >> "$GITHUB_OUTPUT"

      # Per-service isolation: a service whose build fails (or whose committed
      # dist/ differs from the fresh render) must not stop the other services
      # of this VM from deploying. This step is non-fatal; the verdict is
      # enforced by "Fail build job" below, AFTER the trace (per-service
      # ok/fail status) is uploaded for the deploy job to read.
      - name: Ship via cloud-builder
        id: ship
        continue-on-error: true
        # Fail fast instead of burning the full job ceiling: a single
        # stuck build/push inside this step (cold docker cache, oci-builder
        # hang) should surface as its own timeout well before the job-level
        # timeout-minutes:90 above force-kills the whole job (misreported
        # as "cancelled"). 80 min leaves headroom for the earlier setup
        # steps (checkout, vault, cache restore, image pull) within the
        # 90 min job budget.
        #
        # A static inner budget is not enough on its own: pre-dispatch work
        # took 17 min in run 30751065637, so any constant that outlives the
        # step ceiling still gets force-killed. SHIP_DEADLINE_EPOCH (below)
        # hands the engine the real wall-clock deadline so the build-dispatch
        # poll loop clamps itself to the time that actually remains.
        timeout-minutes: 80
        env:
          CHANGED_DIRS: ${{ matrix.changed_dirs }}
          SHIP_MODE: build
          SSH_KEY: ${{ steps.ssh.outputs.ssh_key }}
          SSH_HOST: ${{ steps.ssh.outputs.ssh_host }}
          SSH_USER: ${{ steps.ssh.outputs.ssh_user }}
          SSH_ALIAS: ${{ matrix.vm }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Long-lived read:packages PAT the deploy logs each VM into ghcr.io
          # with (step_compose). Optional: unset, the VM keeps its existing
          # credential. Never GITHUB_TOKEN for that — see deploy-compose.sh.
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTIONS: true
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: diegonmarcos/cloudy-t-infra
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          TRACE_DIR: ${{ runner.temp }}/traces
        run: |
          # Wall-clock deadline for this step, handed to the engine so the
          # build-dispatch poll loop can clamp its budget to the time that
          # actually remains instead of a static constant that outlives the
          # step ceiling. 80 min step - 3 min slack for teardown/artifacts.
          export SHIP_DEADLINE_EPOCH=$(( $(date +%s) + 4620 ))
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # BUILDER_IMAGE is exported by ./.github/actions/resolve-builder-image
          # which reads II_Unix/cb_containers-builders/build.json (master).
          IMAGE="$BUILDER_IMAGE"
          docker pull "$IMAGE"
          mkdir -p "$TRACE_DIR"
          # Write secrets to runner filesystem — compose mounts them :ro into container
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<SSHEOF
          Host $SSH_ALIAS
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            ServerAliveInterval 10
            ServerAliveCountMax 10
            TCPKeepAlive yes
          SSHEOF
          chmod 600 ~/.ssh/config
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          # Run cloud-builder via compose (image has compose.yaml with writable SSH mount)
          # Pin the container's a_solutions clone to the exact commit this
          # runner checked out — which is the commit `detect` diffed, since
          # both come from the same checkout of client_payload.after. Without
          # this the container would clone the default branch tip and could
          # build a tree newer than the one that was detected.
          A_SOLUTIONS_SHA="$(git -C "$GITHUB_WORKSPACE/a_solutions" rev-parse HEAD)"
          export A_SOLUTIONS_SHA
          echo "a_solutions pinned for the builder: $A_SOLUTIONS_SHA"
          docker run --rm "$IMAGE" cat /opt/cloud-builder/compose.yaml > /tmp/cloud-builder-compose.yaml
          # No --cap-add NET_ADMIN here (unlike deploy) — this job never runs
          # wg-quick (no WG_PRIVATE_KEY passed), so the capability buys nothing.
          # Forward GITHUB_TOKEN + GITHUB_ACTOR INTO the container so the engine
          # can push GHCR with the repo's Actions token. This is load-bearing
          # for PUBLIC images: a package first pushed by GITHUB_TOKEN is
          # repo-scoped and inherits the public repo's visibility (public);
          # pushed by the vault PAT it is user-scoped and private forever. Without
          # this forward, the engine's GITHUB_TOKEN branch is dead (docker compose
          # run does NOT inherit host env) and every new image lands private.
          # a_solutions is NOT bind-mounted, deliberately. This job does not
          # mount $GITHUB_WORKSPACE at all — the builder git-clones cloud-infra
          # itself and its entrypoint re-syncs that clone with a `git nuke`
          # ending in `git clean -fdx`. a_solutions is untracked and gitignored
          # in cloud-infra now, so that clean reaches into the path: it cannot
          # unlink a mountpoint but it does delete the files inside it. A mount
          # here produced a HOLLOW GREEN on run 34031253391 (0 ok, 52 skipped,
          # "no build.sh") and a nix failure on 34034637814 ("Path
          # '_shared/engine.nix' does not exist in Git repository").
          # The engine clones it inside the container instead, AFTER the nuke —
          # see cloud-ship-ci-builder-dispatch.sh. A_SOLUTIONS_SHA pins that
          # clone to the commit detect diffed, so what is built is what was
          # detected. cloud-u-containers is public: no credential needed.
          # NB: keep comments OUT of the backslash-continued block below; a
          # `#` line inside it comments out the remainder of the command.
          docker compose -f /tmp/cloud-builder-compose.yaml run --rm \
            -v "$HOME/git/cloud-vault:/root/git/cloud-vault:ro" \
            -e A_SOLUTIONS_SHA \
            -e TRACE_DIR=/traces \
            -v "$TRACE_DIR:/traces" \
            -v "$HOME/.cargo:/root/.cargo" \
            -v "${{ runner.temp }}/cargo-target:/cargo-target" \
            -e CARGO_HOME=/root/.cargo \
            -e CARGO_TARGET_DIR=/cargo-target \
            -e GITHUB_TOKEN \
            -e GHCR_PULL_TOKEN \
            -e GITHUB_ACTOR \
            -e SHIP_MODE \
            -e SHIP_DEADLINE_EPOCH \
            cloud-builder ship ${{ matrix.vm }}

      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-build-${{ matrix.vm }}
          path: ${{ runner.temp }}/traces/
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail build job if any service failed
        if: always() && steps.ship.outcome == 'failure'
        run: |
          T="${{ runner.temp }}/traces/${{ matrix.vm }}.json"
          echo "::error::Build → ${{ matrix.vm }}: at least one service failed; the others still deploy. Failed services:"
          jq -r '.services[]? | select(.status=="fail") | "  FAILED: \(.dir)"' "$T" 2>/dev/null || echo "  (no per-service trace: the build died before any service ran; nothing on this VM deploys)"
          exit 1

  # ── Deploy: one matrix job per VM, config+secrets render + pull/up ──
  # PLAN-ghcr-artifacts.md item 2. needs: build guarantees every image this
  # pulls was freshly pushed moments ago — the same ordering the single-job
  # `ship` verb gave for free, now explicit via GHA `needs:`. Digest-pinning
  # the pull (rewrite_compose_image_refs / DEPLOY_IMAGE_DIGEST) is NOT wired
  # through yet — deferred, same staged-rollout spirit as item 4 landing
  # with no runner_label first. Deploy still pulls :latest, which `build`
  # just refreshed, so this is a real (not cosmetic) build-then-deploy
  # ordering today, with digest-pinning as the next increment.
  deploy:
    name: "Deploy → ${{ matrix.vm }}"
    needs: [detect, build]
    # Deploy whatever built, even when a sibling service's build failed (the
    # build job is then red and the deploy-gate fails the run at the end).
    if: ${{ !cancelled() && needs.detect.result == 'success' && needs.detect.outputs.has_vms == 'true' }}
    # Arch-agnostic on the RUNNER side — redeploy re-renders compose/config
    # text (nix), rsyncs, and ssh's into the VM; none of that depends on the
    # runner's own CPU architecture the way an image build does. Flat
    # ubuntu-latest here (cheaper than the arm64 hosted runner) is safe in a
    # way the same flattening would NOT be for `build`.
    #
    # PLAN-ghcr-artifacts.md item 4: when config.json declares
    # vms.<host>.runner_label, this runs DIRECTLY on that self-hosted label
    # instead — the runner IS the VM (docker socket local), so ssh/rsync/WG
    # become unnecessary rather than merely skipped. matrix.runner_label is
    # empty string when unset (see detect's RUNNER_LABEL_MAP), and GHA's
    # `||` treats empty string as falsy, so this is byte-for-byte
    # ubuntu-latest until a host actually sets one.
    runs-on: ${{ matrix.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
      # Serialized: all parallel deploy jobs use the same gha-runner WG key
      # (vault/A0_keys/providers/wireguard/gha-runner/, pubkey
      # QEPkGSsJXX...). Parallel jobs race for the single registered peer
      # slot on the gcp-proxy hub — whichever wg-quick handshake lands
      # last "wins" the endpoint, the others silently lose reply packets
      # and every subsequent SSH to a wg_ip target fails with exit 255.
      # max-parallel:1 serializes matrix jobs so only one job at a time
      # holds the wg slot. Trade-off: total deploy time scales linearly with
      # VM count instead of in parallel. Proper fix (per-job WG identity
      # pool) tracked separately — needs new keys + hub peer entries +
      # entrypoint refactor + image rebuild. `build` (above) no longer
      # shares this constraint at all — only deploy still touches the mesh.
      max-parallel: 1
    # 2026-09-06: ONE group for every job that holds the WG slot, fleet-wide
    # (ship deploy, ship-home-manager, cgc-db*, health reports, mail health).
    # The per-VM group only serialised deploys to the SAME VM; a deploy to
    # oci-apps still ran beside a home-manager ship to oci-mail, both as
    # 10.0.0.200, and sshd on oci-apps logged "Connection reset by
    # authenticating user ubuntu 10.0.0.200 [preauth]" the second the
    # endpoint flipped — runs 34035919341 and 34036748541 died on the
    # .secrets scp that way. Owner's call: correctness over parallelism.
    # Known cost of a shared group: GitHub keeps ONE pending run per group,
    # so a newer entrant cancels an older still-pending one (that is why
    # health_mail_full had left this group before). A cancelled deploy is
    # visible in the run list; a WG collision was a green build with a red
    # deploy that read like a network flake.
    concurrency:
      group: ship-wg-runner
      cancel-in-progress: false
      # #844: `queue: max` (GitHub, 2026-05: up to 100 pending jobs/runs per
      # group, FIFO, also at job level; forbidden with cancel-in-progress:true).
      # The "known cost" above is what #840/#842 then patched with requeue
      # jobs, but a single pending slot cannot survive a long holder: while a
      # cgc-db restore-all held the group for hours, every deploy, reconcile
      # and home-manager run evicted the one before it, and unjam-ship then
      # cancelled reindexes (#352). EVERY ship-wg-runner entrant declares
      # queue: max — mixing entrants with and without it is undocumented, so
      # 9_others/test/test_ship_burst_no_dropped_deploy.sh fails if any one
      # lacks it. Each entrant still really needs the WG identity (verified
      # #844: they all run cloud-ship-ci-setup-wireguard.sh; cgc-db's index
      # matrix already left the group, only restore-all stays). Requeue jobs
      # in ship-reconcile.yml remain as the net for a full (100) queue or a
      # human cancel. FIFO means deploys run in queue order, so an older run's
      # deploy does not overtake a newer one in the normal case.
      queue: max
    env:
      OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
      GCP_PROXY_SSH_KEY: ${{ secrets.GCP_PROXY_SSH_KEY }}
      GCP_PROXY_HOST: ${{ secrets.GCP_PROXY_HOST }}
      GCP_PROXY_USER: ${{ secrets.GCP_PROXY_USER }}
      GCP_T4_SSH_KEY: ${{ secrets.GCP_T4_SSH_KEY }}
      GCP_T4_HOST: ${{ secrets.GCP_T4_HOST }}
      GCP_T4_USER: ${{ secrets.GCP_T4_USER }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - name: Fetch build trace
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: trace-build-${{ matrix.vm }}
          path: ${{ runner.temp }}/build-trace

      # Per-service deploy gate: only services whose own build reported ok are
      # deployed. A failed/drifted service is skipped and reported; a missing
      # trace (build died before any service ran) deploys nothing here.
      - name: Select services that built
        id: built
        env:
          VM: ${{ matrix.vm }}
          CHANGED: ${{ matrix.changed_dirs }}
          TRACE: ${{ runner.temp }}/build-trace/${{ matrix.vm }}.json
        run: |
          set -eu
          if [ ! -s "$TRACE" ]; then
            echo "::error::Deploy → $VM skipped: no build trace (build did not reach the services)."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          OK=$(jq -r '.services[]? | select(.status=="ok") | .dir' "$TRACE")
          DIRS=""
          if [ -n "$CHANGED" ]; then
            for d in $CHANGED; do
              if printf '%s\n' "$OK" | grep -qxF "$d"; then DIRS="$DIRS $d"
              else echo "::error::Deploy → $VM: SKIPPING $d (its build did not succeed)"; fi
            done
          else
            DIRS=$(printf '%s' "$OK" | tr '\n' ' ')
            jq -r '.services[]? | select(.status=="fail") | "::error::Deploy → '"$VM"': SKIPPING \(.dir) (its build did not succeed)"' "$TRACE"
          fi
          DIRS=$(printf '%s' "$DIRS" | xargs)
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          if [ -n "$DIRS" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "::warning::Deploy → $VM: nothing built; no deploy"; fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      # a_solutions is its OWN repository (diegonmarcos/cloudy-u-containers),
      # NOT a submodule of this one (split out 2026-09-06). It is checked out
      # at the path every in-repo reference already uses, so nothing
      # downstream changes. fetch-depth: 0 — per-service change detection
      # walks its history. Both repos are public, so GITHUB_TOKEN suffices.
      - name: Checkout cloud-u-containers into a_solutions
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloudy-u-containers
          path: a_solutions
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pin EVERY job to the exact commit the dispatch announced, so the
          # tree that detect diffed is the tree that build and deploy ship.
          # Left unpinned, a container push landing mid-run would have detect
          # decide from commit X while the build job checked out a newer Y —
          # a silent mismatch between what was detected and what was shipped.
          # Empty on all other events, which checks out the default branch.
          ref: ${{ github.event.client_payload.after }}

      - name: Init submodules (cloud-data + unix)
        uses: ./.github/actions/init-submodules
        with:
          include: I_cloud
          recursive: "true"
          cloud_data_deploy_key: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}

      # Always regenerate dist/build-{name}.json + cloud-data-*.json from
      # build.json sources — `redeploy` re-renders compose/configs from
      # these via step_build, same as the build job did (cheap, deterministic
      # nix evaluation; no docker/network involved).
      - name: Regenerate dist/ from build.json sources
        run: |
          # URL scheme: the derive reads cloud-u-android's generated
          # 2_configs/apk-manifest.json from the sibling checkout
          # (a0_docs/eng-specs/url-scheme.md). Sparse + blobless: only that file.
          if [ ! -f "$(dirname "$GITHUB_WORKSPACE")/cloud-u-android/2_configs/apk-manifest.json" ]; then
            rm -rf "$(dirname "$GITHUB_WORKSPACE")/cloud-u-android"
            GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none --sparse \
              https://github.com/diegonmarcos/cloudy-u-android.git "$(dirname "$GITHUB_WORKSPACE")/cloud-u-android"
            git -C "$(dirname "$GITHUB_WORKSPACE")/cloud-u-android" sparse-checkout set 2_configs
          fi
          bash 1_cloud-configs/build.sh all

      # Vault clone — provides ~/git/cloud-vault/vault-keys-docker.envfile that
      # cloud-builder's compose.yaml references via env_file:. Without it,
      # `docker compose run cloud-builder` aborts: "env file ... not found".
      - name: Fetch vault
        uses: ./.github/actions/fetch-vault
        with:
          vault_deploy_key: ${{ secrets.VAULT_DEPLOY_KEY }}

      - name: Resolve builder image
        uses: ./.github/actions/resolve-builder-image

      - name: Resolve SSH credentials
        id: ssh
        run: |
          GHA_CONFIG=""
          for _p in \
              "/app/build-gha.json" \
              "${CLOUD_ROOT:-$PWD}/1_cloud-configs/dist/build-gha.json" \
              "${CLOUD_ROOT:-$PWD}/cloud-data/build-gha.json" \
              "${CLOUD_ROOT:-$PWD}/build-gha.json"; do
              [ -f "$_p" ] && { GHA_CONFIG="$_p"; break; }
          done
          if [ -z "$GHA_CONFIG" ]; then
              _CONS=""
              for _p in \
                  "/app/_cloud-data-consolidated.json" \
                  "${CLOUD_ROOT:-$PWD}/1_cloud-configs/dist/_cloud-data-consolidated.json" \
                  "${CLOUD_ROOT:-$PWD}/cloud-data/_cloud-data-consolidated.json" \
                  "${CLOUD_ROOT:-$PWD}/_cloud-data-consolidated.json"; do
                  [ -f "$_p" ] && { _CONS="$_p"; break; }
              done
              if [ -n "$_CONS" ]; then
                  echo "::warning::build-gha.json not found; deriving from $_CONS — run 9_others/build.sh to materialise the canonical file."
                  GHA_CONFIG="${RUNNER_TEMP:-/tmp}/gha-config.json"
                  jq '
                    ._gha as $g
                    | (.vms | to_entries | map({key: .value.ssh_alias, value: .value.wg_ip}) | from_entries) as $alias_to_wg
                    | $g
                    | .vms |= with_entries(.value += {wg_ip: ($alias_to_wg[.key] // null)})
                  ' "$_CONS" > "$GHA_CONFIG"
              fi
          fi
          [ -n "$GHA_CONFIG" ] || { echo "::error::build-gha.json not found and no consolidated fallback available — run 9_others/build.sh" >&2; exit 1; }
          VM="${{ matrix.vm }}"
          case "$VM" in
            *)         KEY="$OCI_SSH_KEY"
                       HOST=$(jq -r --arg vm "$VM" '.vms[$vm].wg_ip // .vms[$vm].host' "$GHA_CONFIG")
                       USER=$(jq -r --arg vm "$VM" '.vms[$vm].user' "$GHA_CONFIG") ;;
          esac
          echo "ssh_key<<EOFKEY" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$KEY"  >> "$GITHUB_OUTPUT"
          echo "EOFKEY"         >> "$GITHUB_OUTPUT"
          echo "ssh_host=$HOST" >> "$GITHUB_OUTPUT"
          echo "ssh_user=$USER" >> "$GITHUB_OUTPUT"

      - name: Ship via cloud-builder
        if: steps.built.outputs.go == 'true'
        timeout-minutes: 80
        env:
          CHANGED_DIRS: ${{ steps.built.outputs.dirs }}
          SHIP_MODE: deploy
          SSH_KEY: ${{ steps.ssh.outputs.ssh_key }}
          SSH_HOST: ${{ steps.ssh.outputs.ssh_host }}
          SSH_USER: ${{ steps.ssh.outputs.ssh_user }}
          SSH_ALIAS: ${{ matrix.vm }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          # WG is required for *.wg_ip targets (oci-mail 10.0.0.3, oci-apps
          # 10.0.0.6, etc.). Without it the entrypoint's wg-quick block skips
          # and every ssh to a WG-only VM times out. Deploy is the ONLY split
          # job that still needs this — build never passes it (see above).
          #
          # PLAN-ghcr-artifacts.md item 4: empty when this VM has a
          # runner_label — the runner already sits on that VM's own network
          # (its wg0, if any, is host infrastructure managed by home-manager,
          # not something this GHA job needs to join), and bringing up a
          # SECOND wg-quick identity inside a container that may already
          # share the host's network namespace risks conflicting with it.
          WG_PRIVATE_KEY: ${{ matrix.runner_label == '' && secrets.WG_PRIVATE_KEY || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Long-lived read:packages PAT the deploy logs each VM into ghcr.io
          # with (step_compose). Optional: unset, the VM keeps its existing
          # credential. Never GITHUB_TOKEN for that — see deploy-compose.sh.
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTIONS: true
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: diegonmarcos/cloudy-t-infra
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          TRACE_DIR: ${{ runner.temp }}/traces
        run: |
          export SHIP_DEADLINE_EPOCH=$(( $(date +%s) + 4620 ))
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="$BUILDER_IMAGE"
          docker pull "$IMAGE"
          mkdir -p "$TRACE_DIR"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<SSHEOF
          Host $SSH_ALIAS
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            ServerAliveInterval 10
            ServerAliveCountMax 10
            TCPKeepAlive yes
          SSHEOF
          chmod 600 ~/.ssh/config
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          # Pin the container's a_solutions clone to the exact commit this
          # runner checked out — which is the commit `detect` diffed, since
          # both come from the same checkout of client_payload.after. Without
          # this the container would clone the default branch tip and could
          # build a tree newer than the one that was detected.
          A_SOLUTIONS_SHA="$(git -C "$GITHUB_WORKSPACE/a_solutions" rev-parse HEAD)"
          export A_SOLUTIONS_SHA
          echo "a_solutions pinned for the builder: $A_SOLUTIONS_SHA"
          docker run --rm "$IMAGE" cat /opt/cloud-builder/compose.yaml > /tmp/cloud-builder-compose.yaml
          # --cap-add NET_ADMIN — required for wg-quick up wg0 inside the
          # container (this job DOES pass WG_PRIVATE_KEY, unlike build).
          # Same as the build job: no a_solutions bind-mount (the builder's
          # `git clean -fdx` erases into it), the engine clones it inside the
          # container after the nuke, and A_SOLUTIONS_SHA pins that clone to
          # the commit detect diffed. Deploy renders each service's config and
          # compose from <svc>/src, so an absent tree here deploys nothing.
          docker compose -f /tmp/cloud-builder-compose.yaml run --rm \
            --cap-add NET_ADMIN \
            -v "$HOME/git/cloud-vault:/root/git/cloud-vault:ro" \
            -e A_SOLUTIONS_SHA \
            -e TRACE_DIR=/traces \
            -v "$TRACE_DIR:/traces" \
            -e GITHUB_TOKEN \
            -e GHCR_PULL_TOKEN \
            -e GITHUB_ACTOR \
            -e SHIP_MODE \
            -e SHIP_DEADLINE_EPOCH \
            cloud-builder ship ${{ matrix.vm }}

      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-deploy-${{ matrix.vm }}
          path: ${{ runner.temp }}/traces/
          retention-days: 7
          if-no-files-found: ignore

  # ── Collect traces: single push to cloud-data ───────────────
  collect-traces:
    name: Collect traces
    needs: [build, deploy]
    if: always() && needs.detect.outputs.has_vms == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: trace-*
          merge-multiple: true
          path: traces/

      - name: Push traces
        env:
          CLOUD_DATA_DEPLOY_KEY: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}
        run: |
          ls traces/*.json 2>/dev/null || { echo "No traces"; exit 0; }
          mkdir -p ~/.ssh
          printf '%s\n' "$CLOUD_DATA_DEPLOY_KEY" > ~/.ssh/cloud_data_key
          chmod 600 ~/.ssh/cloud_data_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/cloud_data_key -o StrictHostKeyChecking=no"
          git clone --depth 1 git@github.com:diegonmarcos/cloud-data.git /tmp/cd
          cd /tmp/cd
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          mkdir -p reports/traces-gha
          for f in "$GITHUB_WORKSPACE/traces/"*.json; do
            [ -f "$f" ] || continue
            VM=$(jq -r '.vm' "$f"); T="reports/traces-gha/${VM}.json"
            if [ -f "$T" ]; then
              jq --slurpfile n "$f" '. + $n | .[-200:]' "$T" > "${T}.tmp" && mv "${T}.tmp" "$T"
            else
              jq -s '.' "$f" > "$T"
            fi
          done
          git add reports/traces-gha/
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "auto: traces [skip ci]"
          i=0; while [ $i -lt 3 ]; do i=$((i+1)); git push origin main && break
            echo "Retry $i..."; git pull --rebase origin main 2>/dev/null || true; done

  # ── Gate: a detected deploy set that did not deploy is a FAILURE ─
  # detect naming services and the run still ending green or grey is the most
  # expensive outcome this pipeline can produce: the commit is in git, the
  # image is in GHCR, the fleet is on the old code, and nothing anywhere is
  # red. A red run gets fixed in minutes; a silent one cost a full day on
  # 2026-09-09, when my-ai_claude-api ran three hours behind 902bbba9 while
  # the Ship page looked idle.
  #
  # The loss this catches is NOT a bad diff — detect was right. In run
  # 34334421319 it logged "detect: a_solutions af913083..902bbba9" and
  # "VMs: 1 — oci-apps", and Build → oci-apps pushed the image successfully.
  # Deploy → oci-apps then ran ZERO steps: it sat pending on the fleet-wide
  # `ship-wg-runner` group behind a wedged cgc-db run, and GitHub keeps only
  # ONE pending entry per concurrency group, so the next containers-push
  # evicted it. An evicted job is "cancelled" — grey in the UI, no
  # notification, and indistinguishable from a human pressing cancel.
  #
  # `if: always()` is what makes this observable at all: a job cancelled by
  # concurrency does not cancel the RUN, so this gate still executes. Proven
  # in that same run, where Collect traces succeeded beside the cancelled
  # deploy.
  #
  # #401 — the third recurrence of #176. This gate USED to run only when
  # has_vms == 'true', so a run whose Build or Deploy leg was SKIPPED never
  # reached it, and GitHub's all-jobs-ok-or-skipped default let those runs
  # report success. Run 35146335744 is the textbook case: a containers-push,
  # detect "success", empty matrix, "Build → ${{ matrix.vm }}: skipped",
  # "Deploy → ${{ matrix.vm }}: skipped", run green, nothing shipped. The
  # build and deploy jobs are gated on has_vms == 'true' DELIBERATELY — the
  # ship is required only when detect found a changed VM, and a proven no-op
  # must stay green — so the fix is NOT to make those jobs unconditional. It is
  # to make THIS job the always-running arbiter of the run's conclusion and to
  # have it demand a positive `verdict` from detect before it accepts a skip:
  #   verdict=ship            -> build AND deploy must both be success
  #   verdict=nothing-to-ship -> skip was proven correct; run is green by
  #                               declaration, not by omission
  #   verdict=empty            -> containers-push found nothing deployable; FAIL
  #   verdict=held             -> only auth-plane services changed and the
  #                               #1886 hold kept them out; FAIL, naming the
  #                               explicit Ship that deploys them once approved
  #   detect not success       -> no reliable verdict at all; FAIL
  deploy-gate:
    name: Deploy gate
    needs: [detect, build, deploy]
    # detect is listed explicitly rather than relied on transitively: the
    # needs context is only guaranteed to carry direct dependencies' outputs.
    # `if: always()` so a SKIPPED or FAILED build/deploy still reaches this
    # job — that is the whole point of #401.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert the run shipped what detect required, or provably had nothing to ship
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          VERDICT: ${{ needs.detect.outputs.verdict }}
          HAS_VMS: ${{ needs.detect.outputs.has_vms }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          MATRIX: ${{ needs.detect.outputs.matrix }}
          HELD: ${{ needs.detect.outputs.held }}
        run: |
          set -eu
          [ -z "$HELD" ] || echo "::warning::auth plane held out of this Ship (#1886): $HELD -- ships only by an approved workflow_dispatch services=$(printf '%s' "$HELD" | tr ' ' ',')"
          # 1. No reliable detection verdict -> the run cannot be green.
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::detect ended '$DETECT_RESULT' (verdict='$VERDICT') — there is no basis on which a Ship run may conclude success. Investigate the detect job itself."
            exit 1
          fi
          # 2. detect positively proved nothing deployable changed -> build/deploy
          #    being skipped is the CORRECT outcome, green by declaration.
          if [ "$VERDICT" = "nothing-to-ship" ]; then
            echo "deploy not required — detect proved nothing to ship (verdict=nothing-to-ship); skipped Build/Deploy is correct, run is green BY declaration not by omission"
            exit 0
          fi
          # 3. No verdict at all AND nothing ran = the workflow_run path-relevance
          #    gate skipped the matrix step (an upstream gen-configs commit with
          #    no dist/build-* change). Also a declared no-op -> green.
          if [ -z "$VERDICT" ] && [ "$BUILD_RESULT" = "skipped" ] && [ "$DEPLOY_RESULT" = "skipped" ]; then
            echo "detect produced no verdict and nothing shipped — upstream commit was path-irrelevant; green no-op"
            exit 0
          fi
          # 4. Anything else means a deploy was REQUIRED: verdict is 'ship'
          #    (normal) or 'empty' (a containers-push that should have shipped
          #    something), and the Build/Deploy legs did not both succeed. This
          #    is the exact #401 hollow green and it FAILS the run here.
          MATRIX_COUNT=$(printf '%s' "$MATRIX" 2>/dev/null | jq -r '(.include // []) | length' 2>/dev/null || echo 0)
          if [ "$BUILD_RESULT" != "success" ] || [ "$DEPLOY_RESULT" != "success" ]; then
            echo "::error::detect required a ship (verdict='$VERDICT', has_vms='$HAS_VMS') but Build ended '$BUILD_RESULT' and Deploy ended '$DEPLOY_RESULT'. The run is NOT green. Services in scope:"
            printf '%s' "$MATRIX" 2>/dev/null \
              | jq -r '(.include // [])[] | "  \(.vm): \(.changed_dirs)"' 2>/dev/null || true
            if [ "$VERDICT" = "held" ]; then
              echo "::error::verdict='held': every changed service is auth plane ($HELD) and was held out of the automatic Ship (#1886). Nothing was deployed. Ship it with an approved workflow_dispatch: services=$(printf '%s' "$HELD" | tr ' ' ',')."
            fi
            if [ "$VERDICT" = "empty" ]; then
              echo "::error::verdict='empty': the containers-push diff resolved to no deployable service. Either the change is genuinely not a container service, or detection missed it — investigate before assuming success."
            fi
            if [ "$DEPLOY_RESULT" = "cancelled" ]; then
              echo "::error::'cancelled' with no steps run means the deploy was evicted from the ship-wg-runner concurrency queue. Clear the wedge with the unjam-ship workflow, then re-ship."
            fi
            # #560: the deploy engine now fails on a declared container left in
            # `created` (never started) or dead, instead of logging `docker ps`
            # and exiting 0. That verdict reaches the run through THIS gate.
            if [ "$DEPLOY_RESULT" = "failure" ]; then
              echo "::error::Deploy failed. If its log has 'liveness: DEAD', a declared container did not start ('created' = compose created it and never started it): docker ps -a lists it and its digest matches, but the service is down. Re-ship it; do not trust ps or digests."
            fi
            if [ "$MATRIX_COUNT" -gt 0 ]; then
              echo "::error::re-ship with: workflow_dispatch on ship.yml, services=<dirs above>, vm=<vm above>."
            fi
            exit 1
          fi
          echo "deploy ok — every detected VM shipped (build=$BUILD_RESULT deploy=$DEPLOY_RESULT)"
