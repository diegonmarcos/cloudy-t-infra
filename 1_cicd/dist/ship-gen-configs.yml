name: "Ship → gen-configs (cloud-data)"

on:
  push:
    branches: [main]
    paths:
      # a_solutions is DELIBERATELY ABSENT here. Since 2026-09-06 it is a
      # separate repository (diegonmarcos/cloudy-u-containers), so nothing about
      # a service change touches THIS repo — not a file, not a gitlink — and no
      # `paths:` entry, bare or globbed, can match one. The deriver reads
      # a_solutions/*/build.json out of the CHECKOUT, so the regeneration still
      # sees every service; only the trigger moved, to repository_dispatch.
      - "config.json"
      - "c_vps/ba-clo_cloudflare/src/main.tf"
      - "c_vps/vps_*/src/main.tf"
      - "b_infra/**/src/*.nix"
      # Per-VM build.json, added 2026-09-30. These files are the DOCUMENTED
      # source of the protection overrides (load-shedder.nix: "Per-VM overrides
      # live in b_infra/nixhm-sudo-<alias>/build.json .protection"), but the
      # module does not read them — it reads the CONSOLIDATED artifact this
      # workflow regenerates. Without this entry the override file could not
      # trigger regeneration of the artifact carrying its own overrides, so any
      # .protection edit was inert on arrival: the HM ship rebuilt byte-identical
      # config and reused the previous store path (oci-analytics generations 168/169
      # pointed at the SAME store paths as 166/167), which is indistinguishable
      # from a successful deploy. Measured on #647: git-proxy-api was added to
      # tier1_services in b8ab9163e and the running shedder never saw it.
      - "b_infra/**/build.json"
      # The config tiers, promoted out of the old single 9_others/ directory.
      # (The second entry used to read 1_cicd/dist/1_cicd/src/scripts/**
      # — a doubled path that matched nothing, so script edits never triggered
      # this workflow.)
      - "_dotfiles/git/src/**"
      - "_dotfiles/apps/src/**"
      - "1_cicd/src/**"
      # The emitter's OWN source tree. Editing the thing that generates every
      # config used to trigger no regeneration at all.
      - "1_cloud-configs/src/**"
      - "2_sops/**"
      - "9_others/src/**"
  # A service's build.json is a deriver INPUT (repo-map reads .index_repos out
  # of it), and those files now live in cloud-u-containers. Without this the
  # config regeneration would never see a service being added, renamed or
  # re-declared, and the stale build-gha.json would then make Ship skip it.
  repository_dispatch:
    types: [containers-push]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen-configs
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    # Job-level so the composite `fetch-vault` action (Fetch vault step) inherits
    # it and can materialise the age key + sops-decrypt BEFORE the Generate step.
    # Without this the run aborts "No SOPS age key available". Same fix as
    # ship-home-manager.yml.
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      # Checkout required so the local composite action ./.github/actions/fetch-vault
      # is on disk before we reference it.
      - uses: actions/checkout@v4
        with:
          submodules: false

      # a_solutions is its OWN repository (diegonmarcos/cloudy-u-containers),
      # NOT a submodule of this one (split out 2026-09-06). It is checked out
      # at the path every in-repo reference already uses, so nothing
      # downstream changes. fetch-depth: 0 — per-service change detection
      # walks its history. Both repos are public, so GITHUB_TOKEN suffices.
      - name: Checkout cloud-u-containers into a_solutions
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloudy-u-containers
          path: a_solutions
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pin to the exact commit the dispatch announced, so the tree that
          # was detected is the tree that gets shipped. Empty on every other
          # event, which checks out the default branch as before.
          ref: ${{ github.event.client_payload.after }}

      # Allowlist: `submodules: true` aborts checkout on the first submodule
      # CI cannot reach (vault / notes / cloud-data-lfs are private siblings;
      # cloud-master's own .gitmodules is SSH-only). Init just what is used.
      - uses: ./.github/actions/init-submodules
        with:
          include: I_cloud
          cloud_data_deploy_key: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}

      # derive-mcp-json.ts reads mcp-policy.json's direct_http block (endpoints
      # reached at a mesh IP, e.g. cloud-vault-mcp — no build.json field can
      # express that) from cloud-u-linux. Without this checkout the deriver ran
      # with no policy input and silently emitted two servers short of
      # mcp.desktop.json.tpl, which gen-mcp-tpl.sh (cloud-u-linux) already
      # merges the same block into. Same pattern as lint-pipeline.yml's Phase
      # 44-45: git clone, not actions/checkout (path: cannot land outside
      # $GITHUB_WORKSPACE), sibling of the workspace so it lines up with the
      # ~/git/cloud-u-linux layout derive-mcp-json.ts defaults to. Public repo,
      # no token needed.
      - name: Checkout cloud-u-linux (mcp-policy.json)
        run: git clone --depth 1 https://github.com/diegonmarcos/cloudy-u-linux.git "$(dirname "$GITHUB_WORKSPACE")/cloud-u-linux"

      # derive-code-signatures declares cloud-u-android at root '../cloud-u-android'
      # (1_cloud-configs/src/derivers.json), i.e. a SIBLING of the cloud-infra root.
      # Nothing cloned it here, so every gen-configs run emitted
      #   ::warning:: declared repo 'cloud-u-android' root /root/git/cloud-u-android
      #   is not checked out — its signatures were NOT refreshed
      # and dist/code-signatures-cloud-u-android.json was never produced in CI at
      # all — the biggest repo in the fleet (13k+ files, ~9,900 of them Kotlin) was
      # missing from the structure layer that feeds the code graph, and the only
      # symptom was a warning nobody's exit code ever saw. Same pattern as
      # cloud-u-linux above: git clone (actions/checkout cannot land outside
      # $GITHUB_WORKSPACE), sibling of the workspace, shallow, public repo so no
      # token. GIT_LFS_SKIP_SMUDGE is mandatory, not an optimisation: this repo's
      # element-x fork tracks images through LFS and the runner's smudge filter
      # fails on them, which fails the WHOLE clone. Signature extraction reads
      # source text and never needs an LFS payload.
      - name: Checkout cloud-u-android (code signatures)
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        run: git clone --depth 1 https://github.com/diegonmarcos/cloudy-u-android.git "$(dirname "$GITHUB_WORKSPACE")/cloud-u-android"

      # Vault clone — provides ~/git/cloud-vault/vault-keys-docker.envfile that
      # cloud-builder's compose.yaml references via env_file:. Without it,
      # `docker compose run cloud-builder` aborts: "env file ... not found".
      - name: Fetch vault
        uses: ./.github/actions/fetch-vault
        with:
          vault_deploy_key: ${{ secrets.VAULT_DEPLOY_KEY }}

      - name: Resolve builder image
        uses: ./.github/actions/resolve-builder-image

      - name: Generate inside cloud-builder
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          CLOUD_DATA_DEPLOY_KEY: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTIONS: true
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # BUILDER_IMAGE is exported by ./.github/actions/resolve-builder-image
          # which reads II_Unix/cb_containers-builders/build.json (master).
          IMAGE="$BUILDER_IMAGE"
          docker pull "$IMAGE"
          # Write secrets to runner fs — compose mounts :ro
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          # Run
          # --cap-add NET_ADMIN bootstraps wg-quick inside the container until
          # new cloud-builder images ship with cap_add baked in compose.yaml.
          docker run --rm "$IMAGE" cat /opt/cloud-builder/compose.yaml > /tmp/cloud-builder-compose.yaml
          # Mount the runner's checkout AS the container's cloud repo so the
          # derive writes the regenerated dist/ INTO the workspace the commit
          # step stages. Without this, gen-configs runs on the image-baked
          # /root/git/cloud-t-infra and its output is discarded with the --rm container
          # → the commit step saw "nothing to commit", so newly-declared
          # cloud-data (e.g. wg-public clients + vault keys) never reached origin.
          # See a0_tasks/PLAN_gen-configs-dist-propagation-fix.md.
          # cloud-u-linux mounted at the same path derive-mcp-json.ts's
          # CLAUDE_SOT_DIR default resolves to inside the container (HOME=/root
          # there): /root/git/cloud-u-linux/da_my-ai/data/claude/mcp-policy.json.
          docker compose -f /tmp/cloud-builder-compose.yaml run --rm \
            --cap-add NET_ADMIN \
            -v "$HOME/git/cloud-vault:/root/git/cloud-vault:ro" \
            -v "$(dirname "$GITHUB_WORKSPACE")/cloud-u-linux:/root/git/cloud-u-linux:ro" \
            -v "$(dirname "$GITHUB_WORKSPACE")/cloud-u-android:/root/git/cloud-u-android:ro" \
            -v "$GITHUB_WORKSPACE:/root/git/cloud-t-infra" \
            -e CLOUD_DATA_DEPLOY_KEY \
            cloud-builder gen-configs
          # The container runs as root inside the mounted workspace; reclaim
          # ownership so the runner's git add/commit (next step) can write .git.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      # Commit + push the regenerated dist/ back to main.
      #
      # The orchestrator script (1_cicd/src/scripts/cloud-ship-orchestrate-gen-configs.sh)
      # explicitly says "The regenerated files are committed by the standard
      # ci flow (the workflow caller commits + pushes)" — but until this step
      # was added, no such commit happened. dist/ on origin diverged from what
      # the engine actually produces, and downstream ship-home-manager (which
      # checks out workflow_run.head_sha and reads committed dist/ as-is) saw
      # stale data. Newly declared peers — e.g. wg-public clients added via
      # config.json or new vault keys — never propagated to the running VMs.
      #
      # Why this won't infinite-loop:
      #   • commits made with GITHUB_TOKEN do not re-trigger workflows
      #     (documented GitHub Actions anti-loop)
      #   • the commit message carries [skip ci] as belt-and-braces
      #   • a downstream workflow_run consumer (ship-home-manager) still fires
      #     once per parent ship-gen-configs completion, but by that point
      #     origin/main has the fresh dist for its checkout to pull
      - name: Commit regenerated dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Stage every path the engine writes to.
          #
          # `git add` is ATOMIC: if ONE pathspec is rejected, the whole
          # invocation aborts and stages NOTHING. The `|| true` below used to
          # sit on a single add that included a_solutions/*/... — and since
          # a_solutions became a submodule on 2026-08-27 git answered
          #   fatal: Pathspec 'a_solutions/...' is in submodule 'a_solutions'
          # so 1_cloud-configs/dist/ was never staged either. `2>/dev/null ||
          # true` swallowed it and the next line reported the reassuring
          # "dist/ unchanged — nothing to commit" on EVERY run: a green
          # pipeline that emitted nothing for weeks.
          # The a_solutions copies are gone from this list on purpose — they
          # live in the submodule (cloud-u-containers) and are symlinks into
          # 1_cloud-configs/dist/ anyway. Add one path at a time so a single
          # empty glob can never silence the rest.
          # 1_cloud-configs/dist/ is the consolidator's SOLE write target
          # (cloud-data-config-consolidated.ts:48 CLOUD_DATA_DIR). It was
          # missing here, so every run regenerated the master
          # _cloud-data-consolidated.json + build-*.json and then threw them
          # away — ship-home-manager checks out the committed tree and read a
          # stale master, so a newly declared client (wireguard vault-backup,
          # 2026-08-23) never reached the hub's peer list. Same failure mode
          # the block above describes; the materialized a_solutions copies
          # were staged but the file they are copies OF was not.
          for p in _dotfiles/git/dist/ _dotfiles/apps/dist/ 1_cicd/dist/ 9_others/dist/ \
                   1_cloud-configs/dist/ 1_cloud-configs/manifest.json \
                   b_infra/_shared/vm-pilot/dist/ \
                   b_infra/nixhm-sudo-*/dist/; do
            git add -- "$p" || echo "::warning::could not stage $p"
          done
          if git diff --cached --quiet; then
            echo "::notice::dist/ unchanged — nothing to commit"
            exit 0
          fi
          # Per-command identity (does NOT pollute .git/config — same pattern
          # adopted in cloud-ship-terraform-deploy-apply.sh after b7ec24e6).
          # Subject-only commit message — keep it on ONE line. A multi-line
          # message inside a YAML run-block scalar requires every line to be
          # indented at the block's base indent; lines at column 1 silently
          # break the YAML and the whole workflow fails to validate.
          git \
            -c user.name="Claude" \
            -c user.email="noreply@anthropic.com" \
            commit -m "ci(gen-configs): refresh dist/ from trigger ${GITHUB_SHA::8} via run ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:main
